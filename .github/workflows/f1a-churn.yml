name: F1a fleet churn

on:
  pull_request:
    paths:
      - ".github/workflows/f1a-churn.yml"
      - "scripts/install_kind_tools.sh"
      - "scripts/kind_churn_gate.sh"
      - "deploy/kind/f1a/**"
      - "bench/fleet_churn_bench.py"
      - "kairyu/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: f1a-fleet-churn-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'formal' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  churn:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      F1A_RESULTS_DIR: bench/results/f1a-fleet-churn
      PROFILE: ${{ github.event_name == 'pull_request' && 'smoke' || 'formal' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.32.0
          KUBECTL_VERSION: v1.36.3
        run: bash scripts/install_kind_tools.sh
      - name: Run F1a fleet churn gate
        shell: bash
        run: bash scripts/kind_churn_gate.sh "--${PROFILE}"
      - name: Upload raw and verified evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1a-fleet-churn-${{ env.PROFILE }}-${{ github.run_id }}
          path: bench/results/f1a-fleet-churn
          if-no-files-found: error
          retention-days: 30

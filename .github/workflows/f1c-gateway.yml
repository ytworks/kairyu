name: F1c three-gateway shared BatchStore

on:
  pull_request:
    paths:
      - ".github/workflows/f1c-gateway.yml"
      - "scripts/kind_gateway_gate.sh"
      - "deploy/kind/f1c/**"
      - "deploy/kind/f1a/mock/**"
      - "bench/fleet_gateway_bench.py"
      - "tests/bench/test_fleet_gateway_bench.py"
      - "kairyu/**"
      - ".dockerignore"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    concurrency:
      group: f1c-three-gateway-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'manual' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      F1C_RESULTS_DIR: bench/results/f1c-three-gateway-live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.sha ||
              github.sha
            }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install kind and kubectl
        shell: bash
        env:
          KIND_VERSION: v0.32.0
          KUBECTL_VERSION: v1.36.3
        run: |
          tools_dir="${RUNNER_TEMP}/kairyu-tools"
          mkdir -p "${tools_dir}"

          curl --fail --location --retry 5 --retry-all-errors \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" \
            --output "${tools_dir}/kind"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum" \
            --output "${tools_dir}/kind.sha256"
          echo "$(awk '{print $1}' "${tools_dir}/kind.sha256")  ${tools_dir}/kind" | sha256sum --check

          curl --fail --location --retry 5 --retry-all-errors \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            --output "${tools_dir}/kubectl"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" \
            --output "${tools_dir}/kubectl.sha256"
          echo "$(awk '{print $1}' "${tools_dir}/kubectl.sha256")  ${tools_dir}/kubectl" | sha256sum --check

          chmod +x "${tools_dir}/kind" "${tools_dir}/kubectl"
          echo "${tools_dir}" >> "${GITHUB_PATH}"
      - name: Run the F1c Kubernetes integration test
        shell: bash
        run: bash scripts/kind_gateway_gate.sh
      - name: Upload raw evidence and offline replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1c-three-gateway-${{ github.run_id }}
          path: bench/results/f1c-three-gateway-live
          if-no-files-found: error
          retention-days: 30

name: F2b KV-event freshness and chaos

on:
  pull_request:
    paths:
      - ".github/workflows/f2b-kv-event-chaos.yml"
      - "verification/fleet/correctness/kv_event_f2b_bench.py"
      - "verification/fleet/resilience/fleet_churn_bench.py"
      - "bench/results/f2a-prefix-routing-500-2026-07-28/**"
      - "bench/results/f2b-kv-event-retained/**"
      - "kairyu/__init__.py"
      - "kairyu/audit_io.py"
      - "kairyu/engine/__init__.py"
      - "kairyu/engine/backend.py"
      - "kairyu/outputs.py"
      - "kairyu/sampling_params.py"
      - "kairyu/telemetry.py"
      - "kairyu/orchestration/__init__.py"
      - "kairyu/orchestration/features.py"
      - "kairyu/orchestration/kv_index.py"
      - "kairyu/orchestration/kv_routing.py"
      - "kairyu/orchestration/prefix_index.py"
      - "kairyu/orchestration/replica.py"
      - "kairyu/orchestration/router.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      mode:
        description: Measure once or replay an existing evidence directory
        required: true
        default: measure
        type: choice
        options:
          - measure
          - replay
      profile:
        description: Evidence profile used only in measure mode
        required: true
        default: formal
        type: choice
        options:
          - formal
          - smoke
      evidence_dir:
        description: Repository-relative artifact directory used in replay mode
        required: true
        default: bench/results/f2b-kv-event-retained
        type: string

concurrency:
  group: f2b-kv-event-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      F2B_RESULTS_DIR: bench/results/f2b-kv-event-live
      PROFILE: ${{ github.event_name == 'pull_request' && 'formal' || inputs.profile }}
      REPLAY_DIR: ${{ inputs.evidence_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Sync development dependencies
        run: uv sync --frozen --dev
      - name: Run a fresh F2b measurement
        if: github.event_name == 'pull_request' || inputs.mode == 'measure'
        run: >-
          uv run --frozen python -m verification.fleet.correctness.kv_event_f2b_bench
          --profile "${PROFILE}"
          --output-dir "${F2B_RESULTS_DIR}"
      - name: Replay freshly emitted evidence without remeasurement
        if: github.event_name == 'pull_request' || inputs.mode == 'measure'
        run: >-
          uv run --frozen python -m verification.fleet.correctness.kv_event_f2b_bench
          --verify-artifact "${F2B_RESULTS_DIR}"
          --required-profile "${PROFILE}"
          --require-current-source
          --require-current-runner-context
      - name: Replay a manually selected local artifact
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'replay'
        run: >-
          uv run --frozen python -m verification.fleet.correctness.kv_event_f2b_bench
          --verify-artifact "${REPLAY_DIR}"
          --required-profile formal
          --require-current-source
      - name: Upload live raw and manifest
        if: >-
          always() &&
          (github.event_name == 'pull_request' || inputs.mode == 'measure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f2b-kv-event-${{ env.PROFILE }}-${{ github.run_id }}
          path: ${{ env.F2B_RESULTS_DIR }}
          if-no-files-found: error
          retention-days: 30

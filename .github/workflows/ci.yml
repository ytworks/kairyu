name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Portable CPU tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # G2 A9 verifies the immutable A8 runtime from its measured ancestor.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          # The uv release is pinned: a runner-side upgrade must not change a verdict.
          version: "0.11.31"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # Networked setup (dependencies, tokenizer data) is cached and retried and
      # is never part of a verdict; the test steps after it run offline.
      - name: "Setup: configure tokenizer cache"
        run: >-
          echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/tiktoken-cache" >> "$GITHUB_ENV"
      - name: "Setup: sync dependencies"
        run: bash scripts/ci_setup_retry.sh uv sync --frozen --dev
      - name: "Setup: restore pinned o200k_base tokenizer data"
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tiktoken-cache
          key: tiktoken-o200k-base-446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d
      - name: "Setup: prefetch pinned o200k_base tokenizer data"
        run: >-
          bash scripts/ci_setup_retry.sh uv run --frozen python -c
          "import tiktoken; tiktoken.get_encoding('o200k_base')"
      - name: "Setup done: test steps run offline"
        run: |
          {
            echo "UV_NO_SYNC=1"
            echo "UV_OFFLINE=1"
            echo "HF_HUB_OFFLINE=1"
          } >> "$GITHUB_ENV"
      - name: Verify required test dependencies
        run: >-
          uv run --frozen python scripts/test_prerequisites.py
          --require-module torch
          --require-module transformers
          --require-module xgrammar
          --require-module jsonschema
          --require-module zmq
          --require-module yaml
      - name: Verify eval and verification inventories and wheel boundary
        if: matrix.python-version == '3.12'
        run: |
          uv run --frozen python scripts/verify_verification_registry.py
          uv run --frozen python scripts/verify_bench_results_index.py
          uv run --frozen python scripts/verify_bench_wheel.py
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test with coverage gate
        run: |
          uv run --frozen coverage erase
          uv run --frozen pytest --fail-on-skip -ra \
            -n 2 --dist loadfile tests/evals \
            --cov=kairyu --cov-report= --cov-fail-under=0
          uv run --frozen pytest --fail-on-skip -ra \
            tests --ignore=tests/evals \
            --cov=kairyu --cov-append --cov-report=term-missing \
            --cov-fail-under=80

  cpu-microbench:
    # Issue #378: a cheap smoke alarm for large CPU hot-path regressions. The
    # same-run legacy ratios use loose bounds and are not formal perf evidence.
    name: CPU microbenchmark regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # The uv release is pinned: a runner-side upgrade must not change a verdict.
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
      - name: "Setup: sync dependencies"
        run: bash scripts/ci_setup_retry.sh uv sync --frozen --dev
      - name: "Setup done: test steps run offline"
        run: |
          {
            echo "UV_NO_SYNC=1"
            echo "UV_OFFLINE=1"
            echo "HF_HUB_OFFLINE=1"
          } >> "$GITHUB_ENV"
      - name: Run variance-tolerant CPU microbenchmarks
        env:
          KAIRYU_CPU_MICROBENCH_REPORT: ${{ runner.temp }}/kairyu-cpu-microbench/report.json
        run: >-
          uv run --frozen python scripts/cpu_microbench_gate.py
          --output "$KAIRYU_CPU_MICROBENCH_REPORT"
      - name: Retain CPU microbenchmark diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-microbench-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kairyu-cpu-microbench/report.json
          if-no-files-found: error
          retention-days: 7

  compose-smoke:
    # Black-box gate C3 (goal G3): gateway + 3 mock replicas from a cold
    # docker compose up, including the kill/recover test. Outside coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # The uv release is pinned: a runner-side upgrade must not change a verdict.
          version: "0.11.31"
          enable-cache: true
      - name: "Setup: sync dependencies"
        run: bash scripts/ci_setup_retry.sh uv sync --frozen --dev
      - name: "Setup: build Compose images"
        run: bash scripts/ci_setup_retry.sh ./scripts/compose_smoke.sh --setup-only
      - name: "Setup: pull the pinned PostgreSQL image"
        run: bash scripts/ci_setup_retry.sh bash scripts/postgres_integration.sh --setup-only
      - name: "Setup done: test steps run offline"
        run: |
          {
            echo "UV_NO_SYNC=1"
            echo "UV_OFFLINE=1"
            echo "HF_HUB_OFFLINE=1"
          } >> "$GITHUB_ENV"
      - name: Validate Compose bind sources
        run: uv run --frozen --no-dev python scripts/validate_compose_binds.py deploy/compose/docker-compose*.yaml
      - name: Compose integration test
        run: ./scripts/compose_smoke.sh --no-setup
      - name: PostgreSQL integration tests
        run: bash scripts/postgres_integration.sh --no-setup

  webui-e2e:
    # Goal P-B3: a pinned Open WebUI release must support first-user setup,
    # direct/auto streaming, persistence, and gateway outage/recovery.
    # Keep this independent from compose-smoke so the two image-heavy gates run
    # in parallel and a failure identifies the affected product surface.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Setup and test are separate steps that must name one Compose project.
      WEBUI_SMOKE_PROJECT_NAME: kairyu-webui-smoke-ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # The uv release is pinned: a runner-side upgrade must not change a verdict.
          version: "0.11.31"
          enable-cache: true
      - name: "Setup: sync dependencies"
        run: bash scripts/ci_setup_retry.sh uv sync --frozen --no-dev
      - name: "Setup: build and pull WebUI images"
        run: bash scripts/ci_setup_retry.sh ./scripts/webui_smoke.sh --setup-only
      - name: "Setup done: test steps run offline"
        run: |
          {
            echo "UV_NO_SYNC=1"
            echo "UV_OFFLINE=1"
            echo "HF_HUB_OFFLINE=1"
          } >> "$GITHUB_ENV"
      - name: Validate WebUI Compose bind sources
        run: >-
          uv run --frozen --no-dev python scripts/validate_compose_binds.py
          deploy/compose/docker-compose.webui.yaml
      - name: Open WebUI browser end-to-end test
        run: ./scripts/webui_smoke.sh --no-setup

  verification-exec-container:
    # Issue #210: the real isolation/conformance gate is mandatory here. The
    # test fails (never skips) if Docker or the exact pinned image is absent.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # The uv release is pinned: a runner-side upgrade must not change a verdict.
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
      - name: "Setup: sync dependencies"
        run: bash scripts/ci_setup_retry.sh uv sync --frozen --dev
      - name: "Setup: build and pin execution image"
        run: |
          iidfile="$RUNNER_TEMP/kairyu-verification-exec-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.iid"
          bash scripts/ci_setup_retry.sh docker build \
            --iidfile "$iidfile" \
            -f deploy/verification/Dockerfile.exec \
            deploy/verification
          image_id="$(tr -d '\r\n' < "$iidfile")"
          test "${image_id#sha256:}" != "$image_id"
          echo "KAIRYU_EXEC_IMAGE=$image_id" >> "$GITHUB_ENV"
      - name: "Setup done: test steps run offline"
        run: |
          {
            echo "UV_NO_SYNC=1"
            echo "UV_OFFLINE=1"
            echo "HF_HUB_OFFLINE=1"
          } >> "$GITHUB_ENV"
      - name: Real Docker runner conformance
        run: >-
          uv run --frozen pytest --fail-on-skip
          -m docker_exec tests/evals/test_bench_exec_docker.py -v --no-cov

  kind-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # The uv release is pinned: a runner-side upgrade must not change a verdict.
          version: "0.11.31"
          enable-cache: true
      - name: "Setup: sync dependencies"
        run: bash scripts/ci_setup_retry.sh uv sync --frozen --dev
      - name: "Setup: install kind, kubectl and Helm"
        env:
          KIND_VERSION: v0.31.0
          KUBECTL_VERSION: v1.35.0
          # Pinned so the Helm gates do not depend on the runner image's Helm.
          HELM_VERSION: v3.22.1
        run: bash scripts/install_kind_tools.sh
      - name: "Setup: build the kind smoke image archive and pull the node image"
        run: bash scripts/ci_setup_retry.sh bash scripts/kind_smoke.sh --setup-only
      - name: "Setup done: test steps run offline"
        run: |
          {
            echo "UV_NO_SYNC=1"
            echo "UV_OFFLINE=1"
            echo "HF_HUB_OFFLINE=1"
          } >> "$GITHUB_ENV"
      - name: Helm schema and GPU template gate
        run: bash scripts/kind_smoke.sh --helm-check
      - name: Run Helm integration tests
        run: bash scripts/helm_integration.sh
      - name: kind smoke (m10a D5)
        run: bash scripts/kind_smoke.sh --no-setup

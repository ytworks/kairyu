name: codex-gate

# M20 WP-05 (docs/design/m20-responses-compat.md, D1/D22): real Codex CLI
# binaries against Kairyu on ScenarioBackend (scripts/codex_gate/run_matrix.py).
# - pull requests touching the Responses surface or the gate: the pinned
#   Codex release (blocking);
# - nightly: the pinned versions (blocking) and npm latest/alpha (advisory);
# - weekly: OpenAPI and Codex drift against the pins opens an issue.
# The pinned release is run_matrix's default (CODEX_TAG in
# scripts/codex_model_catalog.py), so moving the pin moves these jobs too.

on:
  pull_request:
    paths:
      - ".github/workflows/codex-gate.yml"
      - "kairyu/entrypoints/server/responses/**"
      - "scripts/codex_model_catalog.py"
      - "scripts/codex_gate/**"
      - "tests/support/scenario_*.py"
  schedule:
    - cron: "17 4 * * *"
    - cron: "41 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codex-gate-${{ github.event.pull_request.number || github.event.schedule || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr:
    name: Codex pinned matrix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --dev
      # Codex runs commands under bubblewrap on Linux, which needs unprivileged
      # user namespaces; Ubuntu 24.04 restricts them through AppArmor (the
      # workaround of openai/codex-action, issue #75).
      - name: Enable Linux user namespaces for bubblewrap
        run: |
          set -euo pipefail
          if [[ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" != 1 ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the Codex matrix
        env:
          OUT: ${{ runner.temp }}/codex-gate
          CACHE: ${{ runner.temp }}/codex-cache
        run: >-
          uv run --frozen python -m scripts.codex_gate.run_matrix
          --out "$OUT" --cache-dir "$CACHE"
      - name: Retain Codex matrix artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-gate-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-gate
          if-no-files-found: warn
          retention-days: 7

  nightly:
    name: Codex ${{ matrix.codex }} matrix
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '17 4 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # latest and alpha are advisory: they report Codex drift, not a Kairyu
    # regression, until the weekly procedure moves the pin.
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        # 0.147.0 and 0.153.4 run only the scenarios whose wire differs from
        # the pin (m20 §3): tool loops (0.147 sends the catalog's
        # supports_parallel_tool_calls; shell_command fixture) and compaction
        # (both still carry the V1 remote-compaction client; compact-v1).
        include:
          - codex: pinned
            advisory: false
            scenarios: ""
          - codex: "0.153.4"
            advisory: false
            scenarios: namespace-tool-loop local-compaction overflow-compaction
          - codex: "0.147.0"
            advisory: false
            scenarios: namespace-tool-loop local-compaction overflow-compaction
          - codex: latest
            advisory: true
            scenarios: ""
          - codex: alpha
            advisory: true
            scenarios: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --dev
      # Codex runs commands under bubblewrap on Linux, which needs unprivileged
      # user namespaces; Ubuntu 24.04 restricts them through AppArmor (the
      # workaround of openai/codex-action, issue #75).
      - name: Enable Linux user namespaces for bubblewrap
        run: |
          set -euo pipefail
          if [[ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" != 1 ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the Codex matrix
        env:
          CODEX: ${{ matrix.codex }}
          SCENARIOS: ${{ matrix.scenarios }}
          OUT: ${{ runner.temp }}/codex-gate
          CACHE: ${{ runner.temp }}/codex-cache
        run: |
          set -euo pipefail
          args=(--out "$OUT" --cache-dir "$CACHE")
          if [[ "$CODEX" != pinned ]]; then
            args+=(--codex "$CODEX")
          fi
          for scenario in $SCENARIOS; do
            args+=(--scenario "$scenario")
          done
          uv run --frozen python -m scripts.codex_gate.run_matrix "${args[@]}"
      - name: Retain Codex matrix artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-gate-${{ matrix.codex }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-gate
          if-no-files-found: warn
          retention-days: 14

  drift:
    name: Weekly reference drift
    if: github.event_name == 'schedule' && github.event.schedule == '41 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --dev
      - name: Compare the OpenAPI and Codex pins with upstream
        env:
          TITLE: ${{ runner.temp }}/drift-title.txt
          REPORT: ${{ runner.temp }}/drift.md
        run: >-
          uv run --frozen python -m scripts.codex_gate.drift
          --title "$TITLE" --report "$REPORT"
      - name: Open a drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ runner.temp }}/drift-title.txt
          REPORT: ${{ runner.temp }}/drift.md
        run: |
          set -euo pipefail
          if [[ ! -s "$TITLE" ]]; then
            echo "no drift"
            exit 0
          fi
          title="$(cat "$TITLE")"
          # One issue per drifted state, open or closed: an acknowledged
          # state is not reported again.
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 200 \
            --search "M20 reference drift in:title" --json title --jq '.[].title' \
            | grep -Fxq -- "$title"; then
            echo "already reported: $title"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$REPORT"

name: F1b zero-failure rollout

on:
  pull_request:
    paths:
      - ".github/workflows/f1b-rollout.yml"
      - "scripts/install_kind_tools.sh"
      - "scripts/kind_rollout_gate.sh"
      - "deploy/kind/f1a/base/**"
      - "deploy/kind/f1a/mock/**"
      - "deploy/kind/f1a/kind-config.yaml"
      - "deploy/kind/f1b/**"
      - "verification/fleet/resilience/fleet_churn_bench.py"
      - "verification/fleet/resilience/fleet_rollout_bench.py"
      - "kairyu/**"
      - ".dockerignore"
      - "Dockerfile"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      profile:
        description: Rollout profile
        required: true
        default: formal
        type: choice
        options:
          - formal
          - smoke

permissions:
  contents: read

jobs:
  rollout:
    concurrency:
      group: f1b-zero-failure-rollout-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'formal' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      F1B_RESULTS_DIR: bench/results/f1b-zero-failure-rollout
      PROFILE: >-
        ${{
          github.event_name == 'pull_request' && 'smoke' ||
          inputs.profile
        }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.sha ||
              github.sha
            }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.32.0
          KUBECTL_VERSION: v1.36.3
        run: bash scripts/install_kind_tools.sh
      - name: Run F1b zero-failure rollout gate
        shell: bash
        run: bash scripts/kind_rollout_gate.sh "--${PROFILE}"
      - name: Upload raw and verified evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1b-zero-failure-rollout-${{ env.PROFILE }}-${{ github.run_id }}
          path: bench/results/f1b-zero-failure-rollout
          if-no-files-found: error
          retention-days: 30

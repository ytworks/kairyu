[project]
name = "kairyu"
version = "0.1.0"
description = "vLLM-compatible LLM inference framework with native orchestration (Router / Conductor / MoA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6",
    "uvicorn>=0.30",
    # Match the production Uvicorn runtime used by the pinned vLLM image.
    # Uvicorn selects both automatically when they are installed; Linux-only
    # markers keep portable development installs unchanged.
    "httptools>=0.8.0; sys_platform == 'linux'",
    "uvloop>=0.22.1; sys_platform == 'linux'",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "xxhash>=3.5",
]

[project.optional-dependencies]
# Real-model support (tokenizer/weights); heavy GPU kernels live in the gpu extra.
hf = [
    "tokenizers>=0.21.1",
    "safetensors>=0.5",
]
# Real-model engine runtime: torch + structured-output + tokenizer/weights.
# Platform-independent (torch resolves via flashinfer on the gpu image); this
# is the install path for running real models WITHOUT the dev group.
engine = [
    "torch>=2.6",
    "xgrammar>=0.2.3",
    "tokenizers>=0.21.1",
    "safetensors>=0.5",
    "transformers>=5.12,<5.13",
]
# CPU production embeddings without pulling the multi-GB PyTorch runtime.
# Model snapshots are resolved at an explicitly configured revision and ONNX
# Runtime owns inference; the tokenizer supplies exact request usage.
embeddings = [
    "fastembed==0.8.0",
]
# Strict raster validation at the VLM gateway boundary. The stock vLLM
# replica owns model processing; Kairyu only verifies inline image inputs.
vision = [
    "pillow>=10",
]
# OpenTelemetry span export (L2-safe no-op without it).
otel = ["opentelemetry-sdk>=1.27"]
# GPU kernels/fabric: linux-only markers so macOS `uv sync` ignores them.
gpu = [
    "flashinfer-python>=0.6.14; sys_platform == 'linux'",
    "kernels==0.12.3; sys_platform == 'linux'",
    "triton>=3.0; sys_platform == 'linux'",
    "nixl>=0.2; sys_platform == 'linux'",
]
# FlashAttention-4 is currently an upstream beta and pins a prerelease CuTe
# DSL. Keep it opt-in for generic installs; the CUDA 13 production image uses
# upstream's recommended cu13 extra so operators can explicitly compare it
# with FlashInfer.
flashattention4 = [
    "flash-attn-4[cu13]==4.0.0b24; sys_platform == 'linux'",
    # uv only treats a prerelease pin as explicit when it is first-party.
    # beta24's cu13 extra pins this wheel transitively, so declare the exact
    # upstream-required build here instead of enabling unrelated prereleases.
    "nvidia-cutlass-dsl-libs-cu13==4.6.0.dev0; sys_platform == 'linux'",
]
# Process-split engine service and fleet transports (m8 D6, G5).
fleet = [
    "pyzmq>=26",
    "msgpack>=1.0",
    "psycopg[binary]>=3.2",
]
# Checkout-only eval dataset, normalization, and scoring dependencies.
evals = [
    "datasets>=3.2",
    "huggingface_hub>=0.26",
    "immutabledict>=4.2",  # vendored official IFEval checker registry data
    "langdetect==1.0.9",  # pinned IFEval language-detection semantics
    "nltk==3.9.2",  # pinned IFEval tokenization semantics; punkt_tab cached separately
    "tiktoken>=0.7",  # deterministic RULER long-context token construction
    "tqdm>=4.66",  # interactive progress bars; absence degrades to log lines
    "jsonschema==4.26.0",  # pinned Draft 2020-12 structured-output scoring semantics
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "torch>=2.6",
    "xgrammar>=0.2.3",
    "tokenizers>=0.21.1",
    "safetensors>=0.5",
    "pyzmq>=26",
    "msgpack>=1.0",
    "psycopg[binary]>=3.2",
    "opentelemetry-sdk>=1.27",
    "transformers>=5.12,<5.13",  # pinned band: template goldens byte-match (m9 D2)
    "openai>=1.66",
    "datasets>=3.2",  # hf_hub-marked eval download tests
    "immutabledict>=4.2",
    "langdetect==1.0.9",
    "nltk==3.9.2",
    "pillow>=10",
    "tiktoken>=0.7",  # retained RULER long-context coverage
    "jsonschema==4.26.0",
]

[project.scripts]
kairyu = "kairyu.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairyu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Environment-dependent suites are deselected from the portable CPU suite.
# Dedicated jobs/scripts select applicable gates only after checking their
# prerequisites, and reject selected skips. CLI `-m` overrides this expression.
addopts = "--cov=kairyu --strict-markers -m 'not gpu and not hf_hub and not docker_exec and not helm and not postgres and not vllm'"
# Pytest's built-in default ignores every directory named `dist`, including
# tests/dist. Keep build outputs ignored without hiding distributed tests.
norecursedirs = [".git", ".tox", ".venv", "build"]
markers = [
    "gpu: requires CUDA hardware (runs on deploy day via scripts/gpu_gates)",
    "hf_hub: downloads real weights from the HF Hub (opt-in, networked)",
    "docker_exec: requires Docker and a pinned KAIRYU_EXEC_IMAGE",
    "helm: requires the Helm executable (runs in the kind CI job)",
    "postgres: requires KAIRYU_TEST_POSTGRES_DSN for a real PostgreSQL server",
    "vllm: requires an installed real vLLM package",
    "dist: spawns torch.distributed multi-process workers (slower)",
]

[tool.coverage.run]
# the spawned engine service (m8 D6) flushes coverage on clean exit
concurrency = ["thread", "multiprocessing"]
sigterm = true
source = ["kairyu"]
omit = ["*/*_gpu.py", "kairyu/kernels/*", "kairyu/bench/_vendor/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

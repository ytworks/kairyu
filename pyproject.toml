[project]
name = "kairyu"
version = "0.1.0"
description = "vLLM-compatible LLM inference framework with native orchestration (Router / Conductor / MoA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "xxhash>=3.5",
]

[project.optional-dependencies]
# Real-model support (tokenizer/weights); heavy GPU kernels live in the gpu extra.
hf = [
    "tokenizers>=0.20",
    "safetensors>=0.5",
]
# Real-model engine runtime: torch + structured-output + tokenizer/weights.
# Platform-independent (torch resolves via flashinfer on the gpu image); this
# is the install path for running real models WITHOUT the dev group.
engine = [
    "torch>=2.6",
    "xgrammar>=0.2.3",
    "tokenizers>=0.20",
    "safetensors>=0.5",
]
# OpenTelemetry span export (L2-safe no-op without it).
otel = ["opentelemetry-sdk>=1.27"]
# GPU kernels/fabric: linux-only markers so macOS `uv sync` ignores them.
gpu = [
    "flashinfer-python>=0.2; sys_platform == 'linux'",
    "triton>=3.0; sys_platform == 'linux'",
    "nixl>=0.2; sys_platform == 'linux'",
]
# FlashAttention-4 is currently an upstream beta and pins a prerelease CuTe
# DSL. Keep it opt-in for generic installs; the SM120 production image enables
# this extra so operators can explicitly compare it with FlashInfer.
flashattention4 = [
    "flash-attn-4==4.0.0b24; sys_platform == 'linux'",
]
# Process-split engine service and fleet transports (m8 D6, G5).
fleet = [
    "pyzmq>=26",
    "msgpack>=1.0",
    "psycopg[binary]>=3.2",
]
# Fugu-suite dataset download/normalization (kairyu bench download); the
# runner itself needs only core deps (httpx), so offline runs need no extras.
bench = [
    "datasets>=3.2",
    "huggingface_hub>=0.26",
    "pillow>=10",
    "h5py>=3.11",  # SciCode golden data (test_data.h5)
    "tiktoken>=0.7",  # official o200k_base bins for the MRCRv2 slice
    "tqdm>=4.66",  # interactive progress bars; absence degrades to log lines
]
# Official agentic harnesses (SWE-Bench Pro, Terminal-Bench 2.1); need docker.
# The tau3/tau2 harness is not on PyPI — see docs/benchmarks.md.
bench-agentic = [
    "mini-swe-agent>=2",
    "swebench>=4",
    "harbor>=0.17; python_version >= '3.12'",  # Terminal-Bench 2.x harness
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "torch>=2.6",
    "xgrammar>=0.2.3",
    "tokenizers>=0.20",
    "safetensors>=0.5",
    "pyzmq>=26",
    "msgpack>=1.0",
    "psycopg[binary]>=3.2",
    "opentelemetry-sdk>=1.27",
    "transformers>=5.12,<5.13",  # pinned band: template goldens byte-match (m9 D2)
    "openai>=1.66",
    "datasets>=3.2",  # hf_hub-marked bench download tests
    "pillow>=10",
]

[project.scripts]
kairyu = "kairyu.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairyu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Environment-dependent suites are deselected from the portable CPU suite.
# Dedicated jobs/scripts select applicable gates only after checking their
# prerequisites, and reject selected skips. CLI `-m` overrides this expression.
addopts = "--cov=kairyu --cov-report=term-missing --strict-markers -m 'not gpu and not hf_hub and not docker_exec and not helm and not postgres and not vllm'"
# Pytest's built-in default ignores every directory named `dist`, including
# tests/dist. Keep build outputs ignored without hiding distributed tests.
norecursedirs = [".git", ".tox", ".venv", "build"]
markers = [
    "gpu: requires CUDA hardware (runs on deploy day via scripts/gpu_gates)",
    "hf_hub: downloads real weights from the HF Hub (opt-in, networked)",
    "docker_exec: requires Docker and a pinned KAIRYU_BENCH_EXEC_IMAGE",
    "helm: requires the Helm executable (runs in the kind CI job)",
    "postgres: requires KAIRYU_TEST_POSTGRES_DSN for a real PostgreSQL server",
    "vllm: requires an installed real vLLM package",
    "dist: spawns torch.distributed multi-process workers (slower)",
]

[tool.coverage.run]
# the spawned engine service (m8 D6) flushes coverage on clean exit
concurrency = ["thread", "multiprocessing"]
sigterm = true
omit = ["*/*_gpu.py", "kairyu/kernels/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

name: kairyu-qwen38-27b-1gpu

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3}
    ipc: host
    cpuset: ${GPU_CPUSET}
    environment:
      HF_HOME: /models/.cache
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_USE_DEEP_GEMM: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      SAFETENSORS_FAST_GPU: "1"
    volumes:
      - type: bind
        source: ${MODEL_STORAGE_PATH}
        target: /models
        read_only: true
      - type: bind
        source: ${VLLM_CACHE_PATH}
        target: /root/.cache/vllm
      - ./chat_template.jinja:/etc/kairyu/qwen3.8-chat.jinja:ro
    command:
      - /models/qwen3.8-27b-fp8
      - --served-model-name
      - qwen3.8-27b
      - --max-model-len
      - "262144"
      - --mm-processor-kwargs
      - '{"min_pixels":65536,"max_pixels":2097152}'
      - --limit-mm-per-prompt.image
      - "1"
      - --limit-mm-per-prompt.video
      - "0"
      - --dtype
      - bfloat16
      - --kv-cache-dtype
      - fp8
      - --mamba-cache-dtype
      - float16
      - --mamba-ssm-cache-dtype
      - float16
      - --mamba-cache-mode
      - align
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - "32768"
      - --max-num-seqs
      - "32"
      - --gpu-memory-utilization
      - "0.95"
      - --attention-backend
      - FLASHINFER
      - --enable-flashinfer-autotune
      - --compilation-config
      - '{"cudagraph_mode":"PIECEWISE"}'
      - --generation-config
      - vllm
      - --chat-template
      - /etc/kairyu/qwen3.8-chat.jinja
      - --reasoning-parser
      - qwen3
      # vLLM's qwen3 parser treats a request without enable_thinking=false as
      # thinking and files a direct answer or tool call as reasoning; the
      # template already renders those requests non-thinking, and an explicit
      # effort still enables thinking (2026-10-18 GPU final test).
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --disable-uvicorn-access-log
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 720
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped

  kairyu:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        KAIRYU_VISION: "1"
    image: ${KAIRYU_IMAGE:-local/kairyu:qwen38-vllm-example}
    command: [/etc/kairyu/kairyu.yaml]
    environment:
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_IMAGE_ID:-local-build}
    volumes:
      - type: bind
        source: ${MODEL_STORAGE_PATH}
        target: /models
        read_only: true
      - ./kairyu.yaml:/etc/kairyu/kairyu.yaml:ro
    depends_on:
      vllm: {condition: service_healthy}
    ports:
      - 127.0.0.1:${API_PORT:-8001}:8000
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 120
    restart: unless-stopped

  chat-ui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.3@sha256:ef11a68f38457d831e23168486858c25b9d9c4399094c9e72c0d4d8767ac09de}
    environment:
      OPENAI_API_BASE_URL: http://kairyu:8000/v1
      OPENAI_API_KEY: sk-local-kairyu
      # m11 D7 amendment 2026-10-17: the Chat UI reaches Kairyu over
      # /v1/responses; control.py installs webui-responses-filter.py.
      OPENAI_API_CONFIGS: '{"0":{"api_type":"responses"}}'
      DEFAULT_MODELS: qwen3.8-27b
      DEFAULT_MODEL_PARAMS: '{"max_tokens":32768,"temperature":1.0,"top_p":0.95}'
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      WEBUI_AUTH: "true"
      WEBUI_URL: ${WEBUI_URL:-http://localhost:3000}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Kairyu Admin}
      ENABLE_OLLAMA_API: "false"
      RAG_EMBEDDING_ENGINE: ""
    volumes:
      - type: bind
        source: ${WEBUI_STORAGE_PATH}
        target: /app/backend/data
    depends_on:
      kairyu: {condition: service_healthy}
    ports:
      - ${CHAT_UI_BIND_ADDRESS:-127.0.0.1}:${CHAT_UI_PORT:-3000}:8080
    restart: unless-stopped

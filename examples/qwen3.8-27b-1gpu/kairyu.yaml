server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  max_concurrency: 64
  admission_wait_timeout_s: 86400
  max_chat_body_bytes: 16777216

engines:
  qwen3.8-27b:
    backend: openai
    health_url: http://vllm:8000/health
    options:
      base_url: http://vllm:8000/v1
      model: qwen3.8-27b
      api_key_env: null
      timeout_s: 86400
      upstream: vllm
      capabilities:
        allow_prompt_kinds: [multimodal]
        allow_chat_template_kwargs: [enable_thinking]
      image_input_policy:
        max_images: 1
        max_image_bytes: 8388608
        max_total_image_bytes: 8388608
        max_image_pixels: 2097152
        max_total_image_pixels: 2097152
        max_image_dimension: 4096
        max_image_aspect_ratio: 200
        max_processed_prompt_tokens: 262144
      model_revision: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
      max_model_len: 262144
      quantization_format: fp8
      cache_descriptor:
        family: qwen3.8-hybrid-mamba-paged-kv
      tensor_parallel_size: 1
      mtp_enabled: false
      container_image_digest: sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3

# m9 D2 amendment 2026-10-17: L1 receives each request in its caller's API
# (chat as the caller's own messages, Responses as Responses, Anthropic
# Messages as Messages); vLLM renders and parses each one with the example's
# chat template (mounted into vLLM).
upstream_chat_models: [qwen3.8-27b]
upstream_responses_models: [qwen3.8-27b]
upstream_messages_models: [qwen3.8-27b]

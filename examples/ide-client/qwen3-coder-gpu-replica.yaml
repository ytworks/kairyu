# Isolated Qwen3-Coder replica for IDE agent-loop checks.
#
# Example launch (keeps the Llama compatibility replica on GPU 1 / port 8002):
#   docker run --rm --gpus '"device=2"' -p 127.0.0.1:8003:8000 \
#     -v "$PWD/examples/ide-client/qwen3-coder-gpu-replica.yaml:/etc/kairyu/config.yaml:ro" \
#     -v /models:/models:ro <kairyu-cuda-image>
engines:
  qwen3-coder-30b-a3b-instruct:
    backend: kairyu
    options:
      model_path: /models/Qwen/Qwen3-Coder-30B-A3B-Instruct
      # Qwen3-Coder is an MoE model. Kairyu currently serves it on one GPU;
      # tensor parallelism for MoE checkpoints is intentionally rejected.
      tensor_parallel_size: 1
      # Kairyu auto-loads the checkpoint's tokenizer-owned chat template.

server:
  # The container listens on all interfaces; the example publish command above
  # exposes it only on the host loopback interface.
  host: 0.0.0.0
  port: 8000
  max_concurrency: 2
  api_keys_env: null

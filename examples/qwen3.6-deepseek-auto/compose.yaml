name: kairyu-qwen3-6-deepseek-auto

# GPU allocation on the 8-GPU reference host (96 GB PCIe-GDDR each):
#
#   GPUs 0-3  DeepSeek-V4-Flash-0731, TP4 + expert parallel
#   GPUs 4-7  Qwen3.6-27B, DP4 (four TP1 engine replicas)
#
# Why this split and not another:
#   - The FP8 DeepSeek checkpoint is ~167 GB of weights: it cannot fit fewer
#     than two GPUs, and its 256 routed experts shard evenly only over 2/4/8-way
#     groups. TP8 would leave nothing for tier1, so TP4 (~42 GB weights per
#     GPU, ample FP8 KV headroom) is the only workable tier2 shape.
#   - Dense 27B Qwen3.6 fits a single 96 GB GPU with a 32k KV budget. This
#     hardware profile is DP-first (docs/roadmap.md): PCIe P2P at 30-37 GB/s
#     makes per-layer TP all-reduce a poor trade for a model that does not
#     need sharding, so four independent TP1 replicas behind vLLM's internal
#     data-parallel load balancer beat TP4 on both throughput and TTFT.
#   - The AUTO multi-agent max tier (MoA) fires three tier1 proposals
#     concurrently; DP4 absorbs them without queueing while tier2 synthesizes.
services:
  vllm-deepseek:
    # Same pinned stock-vLLM image as deploy/compose/docker-compose.webui-vlm.yaml.
    # Kairyu's DeepSeek V4 reference path is single-device; this TP4+EP tier
    # and DSpark drafting stay on stock vLLM >= 0.25.0.
    image: >-
      vllm/vllm-openai:v0.26.0-x86_64-cu129-ubuntu2404@sha256:4d08193d2fd05aadb1b5678f93ae609efb2635df67da45f3efe781c368b34dc8
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - deepseek-v4-flash-model-cache:/root/.cache/huggingface
    command:
      - deepseek-ai/DeepSeek-V4-Flash-0731
      - --revision
      - 7872f01b1d1fe23eabc4c98b48bffcef5a386062
      - --served-model-name
      - deepseek-v4-flash-0731
      - --tensor-parallel-size
      - "4"
      - --enable-expert-parallel
      - --tokenizer-mode
      - deepseek_v4
      - --kv-cache-dtype
      - fp8
      - --block-size
      - "256"
      - --max-model-len
      - "32768"
      - --speculative-config
      - '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy"}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 720
      start_period: 120s

  vllm-qwen:
    # Kairyu's Qwen3.6 reference path is single-device, so this DP4 tier
    # also runs on stock vLLM.
    image: >-
      vllm/vllm-openai:v0.26.0-x86_64-cu129-ubuntu2404@sha256:4d08193d2fd05aadb1b5678f93ae609efb2635df67da45f3efe781c368b34dc8
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - qwen3-6-27b-model-cache:/root/.cache/huggingface
    command:
      - Qwen/Qwen3.6-27B
      - --revision
      - 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
      - --served-model-name
      - qwen3.6-27b
      # DP-first on PCIe hardware: four independent TP1 replicas behind
      # vLLM's data-parallel front end, one per GPU.
      - --data-parallel-size
      - "4"
      - --max-model-len
      - "32768"
      - --reasoning-parser
      - qwen3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --async-scheduling
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4", "5", "6", "7"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 360
      start_period: 60s

  kairyu:
    build:
      context: ../..
    volumes:
      - ./auto-gateway.yaml:/etc/kairyu/config.yaml:ro
      - ./auto-orchestrator.yaml:/etc/kairyu/auto-orchestrator.yaml:ro
      - ./auto-max-orchestrator.yaml:/etc/kairyu/auto-max-orchestrator.yaml:ro
    depends_on:
      vllm-deepseek:
        condition: service_healthy
      vllm-qwen:
        condition: service_healthy
    ports:
      # PORT is the host port the README advertises; it must reach the mapping
      # or a custom value would start a healthy service on 8001 and then time
      # out waiting somewhere else.
      - "127.0.0.1:${PORT:-8001}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

volumes:
  deepseek-v4-flash-model-cache:
  qwen3-6-27b-model-cache:

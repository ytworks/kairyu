# Heterogeneous two-tier AUTO spec: the RuleRouter sends short/easy queries to
# tier1 (Qwen3.6-27B, DP4), heavy signals to tier2 (DeepSeek-V4-Flash, TP4+EP),
# and multi-step prompts through the complete Conductor role DAG, where the
# frontier-class tier2 plans, verifies, and synthesizes around the fast tier1
# worker.
shared_prefix: |
  Work carefully, checking calculations and edge cases.
  Produce the requested artifact immediately. For programming tasks, put the
  complete solution in a Python code block before any explanation.

workers:
  - name: tier1
    backend: openai
    base_url: http://vllm-qwen:8000/v1
    model: qwen3.6-27b
    api_key_env: null
    options: {upstream: vllm}
  - name: tier2
    backend: openai
    base_url: http://vllm-deepseek:8000/v1
    model: deepseek-v4-flash-0731
    api_key_env: null
    options: {upstream: vllm}

roles:
  - name: planner
    worker: tier2
    role_type: planner
    prompt: "[planner] Make a concise plan.\nTask: {query}"
  - name: worker
    worker: tier1
    prompt: "[worker] Execute the plan.\nPlan: {planner}\nTask: {query}"
    depends_on: [planner]
  - name: verifier
    worker: tier2
    role_type: verifier
    verifies: worker
    prompt: "[verifier] Reply PASS or FAIL.\nTask: {query}\nDraft: {worker}"
    depends_on: [worker]
  - name: synthesizer
    worker: tier2
    role_type: synthesizer
    prompt: "[synthesizer] Return the final answer.\nDraft: {worker}\nNotes: {verifier}"
    depends_on: [worker, verifier]

budget:
  max_steps: 8
  max_refine_depth: 1

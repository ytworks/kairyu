# Two-model AUTO gateway: Qwen3.6-27B is the latency tier, DeepSeek-V4-Flash
# the quality tier. Both direct pools and the routed kairyu-auto /
# kairyu-auto-max models are served from one OpenAI-compatible endpoint.
server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  max_concurrency: 64

pools:
  qwen3.6-27b:
    replicas:
      - backend: openai
        health_url: http://vllm-qwen:8000/health
        options:
          base_url: http://vllm-qwen:8000/v1
          model: qwen3.6-27b
          api_key_env: null
          upstream: vllm
    unhealthy_after: 1
    queue_depth_threshold: 8
    probe_interval_s: 2.0
  deepseek-v4-flash-0731:
    replicas:
      - backend: openai
        health_url: http://vllm-deepseek:8000/health
        options:
          base_url: http://vllm-deepseek:8000/v1
          model: deepseek-v4-flash-0731
          api_key_env: null
          upstream: vllm
    unhealthy_after: 1
    queue_depth_threshold: 8
    probe_interval_s: 2.0

orchestrators:
  kairyu-auto:
    spec: auto-orchestrator.yaml
  kairyu-auto-max:
    spec: auto-max-orchestrator.yaml

legacy_chat_models: [qwen3.6-27b, deepseek-v4-flash-0731, kairyu-auto, kairyu-auto-max]

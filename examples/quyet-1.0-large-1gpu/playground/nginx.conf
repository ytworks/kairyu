# Quyet System One playground: the static page, and Kairyu's API on the same origin.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://kairyu:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        # Kairyu bounds bodies itself (systemone max_body_bytes, 8 MiB)
        client_max_body_size 8m;
    }
}

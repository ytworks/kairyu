name: kairyu-quyet-1-0-large-1gpu

services:
  # L1 model server: stock vLLM v0.31.0 holds Quyet-1.0-Large (bf16) on one
  # selected GPU. It is internal: only the System One adapter reads from it, and
  # Kairyu publishes no chat model. control.py passes the settings from example.json.
  vllm:
    image: ${VLLM_IMAGE}
    ipc: host
    cpuset: ${GPU_CPUSET}
    environment:
      HF_HOME: /models/.cache
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      SAFETENSORS_FAST_GPU: "1"
      # Every compile cache on NVMe, none in the container layer on the root disk.
      XDG_CACHE_HOME: /root/.cache
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
      TRITON_CACHE_DIR: /root/.cache/triton
    volumes:
      - type: bind
        source: ${MODEL_STORAGE_PATH}
        target: /models
        read_only: true
      - type: bind
        source: ${VLLM_CACHE_PATH}
        target: /root/.cache
    command:
      - /models/quyet-1.0-large
      - --served-model-name
      - quyet-1.0-large
      - --dtype
      - bfloat16
      # Quyet's longest prompt is 8,000 tokens; the KV cache goes to parallel reads.
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION}"
      # The state opens every question's prompt: its prefill is read once.
      - --enable-prefix-caching
      # Quyet reads text only.
      - --limit-mm-per-prompt
      - '{"image": 0, "video": 0}'
    ports:
      # Host-local L1 access for verify.sh only.
      - 127.0.0.1:${VLLM_HOST_PORT}:8000
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)']
      interval: 5s
      timeout: 4s
      retries: 720
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped

  # L1 System One: the quyet package's prompt and calibration, with its forward
  # pass read from the vLLM above (quyet_systemone.py). CPU only.
  quyet-systemone:
    image: ${QUYET_SYSTEMONE_IMAGE}
    environment:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      QUYET_MODEL_DIR: /models/quyet-1.0-large
      QUYET_UPSTREAM: http://vllm:8000
      QUYET_UPSTREAM_MODEL: quyet-1.0-large
      QUYET_ALIASES: quyet-latest
      QUYET_MAX_INFLIGHT: ${QUYET_MAX_INFLIGHT}
      QUYET_MAX_QUEUE: ${QUYET_MAX_QUEUE}
      QUYET_READ_WORKERS: ${QUYET_READ_WORKERS}
      QUYET_MAX_QUESTIONS: ${QUYET_MAX_QUESTIONS}
      QUYET_PORT: "8092"
    volumes:
      - type: bind
        source: ${MODEL_STORAGE_PATH}
        target: /models
        read_only: true
    depends_on:
      vllm: {condition: service_healthy}
    ports:
      # Host-local direct reads for verify.sh only.
      - 127.0.0.1:${SYSTEMONE_HOST_PORT}:8092
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8092/health", timeout=4)']
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
    restart: unless-stopped

  # L3: Kairyu publishes System One only (kairyu.yaml public_models).
  kairyu:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${KAIRYU_IMAGE:-local/kairyu:quyet-1gpu-example}
    command: [/etc/kairyu/kairyu.yaml]
    environment:
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_IMAGE_ID:-local-build}
    volumes:
      - type: bind
        source: ${PLACEMENT_LOG_PATH}
        target: /var/lib/kairyu/placement
      - ./kairyu.yaml:/etc/kairyu/kairyu.yaml:ro
    depends_on:
      vllm: {condition: service_healthy}
      quyet-systemone: {condition: service_healthy}
    ports:
      - 127.0.0.1:${API_PORT:-8014}:8000
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 120
    restart: unless-stopped

  # Jev-style System One playground: a static page, with Kairyu's API proxied
  # on the same origin (playground/nginx.conf). No authentication.
  playground:
    image: ${PLAYGROUND_IMAGE}
    volumes:
      - ./playground/index.html:/usr/share/nginx/html/index.html:ro
      - ./playground/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      kairyu: {condition: service_healthy}
    ports:
      - ${PLAYGROUND_BIND_ADDRESS:-0.0.0.0}:${PLAYGROUND_PORT:-3015}:8080
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

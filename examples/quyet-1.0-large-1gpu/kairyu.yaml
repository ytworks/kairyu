server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  # Chat generations at once. vLLM runs up to 64 sequences, so the System One
  # reads (QUYET_READ_WORKERS = 32 in flight) always have room beside chat.
  max_concurrency: 8
  admission_wait_timeout_s: 600
  max_chat_body_bytes: 33554432
pools:
  quyet-1.0-large:
    replicas:
    - backend: openai
      # vLLM serves /health, not Kairyu's default /readyz.
      health_url: http://vllm:8000/health
      options:
        base_url: http://vllm:8000/v1
        model: quyet-1.0-large
        api_key_env: null
        timeout_s: 1800
        upstream: vllm
        capabilities:
          allow_prompt_kinds:
          - multimodal
        image_input_policy:
          max_images: 4
          max_image_bytes: 8388608
          max_total_image_bytes: 16777216
          max_image_pixels: 4194304
          max_total_image_pixels: 16777216
          max_image_dimension: 4096
          max_image_aspect_ratio: 200
          max_processed_prompt_tokens: 65536
        container_image_digest: sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
        model_revision: 9a0f051112ba4301f6e4c8b87fc088ce00b11aae
        max_model_len: 65536
        quantization_format: bf16
        tensor_parallel_size: 1
    unhealthy_after: 1
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0
    placement_log_path: /var/lib/kairyu/placement/quyet-1.0-large.jsonl
legacy_chat_models:
- quyet-1.0-large
# Quyet's typed decisions (Jev wire format) from the same vLLM, through this
# example's adapter (quyet_systemone.py). The adapter reads 16 requests at a
# time and queues 16 more, then answers 529. Kairyu forwards at most 16 and
# queues 64, so a burst gets Kairyu's 429, never the adapter's 529. Reads never
# pass through the chat pool: they cannot eject the chat replica.
systemone:
  quyet-1.0-large-systemone:
    base_url: http://quyet-systemone:8092
    upstream_model: Quyet-1.0-Large
    aliases: [quyet-latest, jev-latest, jev-preview]
    description: Quyet-1.0-Large calibrated decisions (Gemma-4-31B-it decision fine-tune, bf16 on vLLM)
    max_concurrency: 16
    max_queue: 64
    queue_wait_s: 30
    timeout_s: 300
    max_questions: 32
    # the adapter's own 8 MiB limit
    max_body_bytes: 8388608

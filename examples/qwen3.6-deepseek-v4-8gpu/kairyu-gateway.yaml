server: {host: 0.0.0.0, port: 8000, api_keys_env: null, max_concurrency: 128}
pools:
  qwen3.6-27b:
    replicas:
      - backend: openai
        health_url: http://kairyu-qwen-4:8000/readyz
        options: &qwen
          base_url: http://kairyu-qwen-4:8000/v1
          model: qwen3.6-27b
          api_key_env: null
          upstream: kairyu
          allow_templated_chat_passthrough: true
          chat_tokenizer: /models/qwen3.6-27b
          model_revision: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
          max_model_len: 262144
          quantization_format: bfloat16
          cache_descriptor: {family: qwen3.6-hybrid-deltanet-paged-kv}
          mtp_enabled: false
      - {backend: openai, health_url: "http://kairyu-qwen-5:8000/readyz", options: {<<: *qwen, base_url: "http://kairyu-qwen-5:8000/v1"}}
      - {backend: openai, health_url: "http://kairyu-qwen-6:8000/readyz", options: {<<: *qwen, base_url: "http://kairyu-qwen-6:8000/v1"}}
      - {backend: openai, health_url: "http://kairyu-qwen-7:8000/readyz", options: {<<: *qwen, base_url: "http://kairyu-qwen-7:8000/v1"}}
    unhealthy_after: 1
    prefix_index: true
    probe_interval_s: 2.0
  deepseek-v4-flash-0731:
    replicas:
      - backend: openai
        health_url: http://kairyu-deepseek:8000/readyz
        options:
          base_url: http://kairyu-deepseek:8000/v1
          model: deepseek-v4-flash-0731
          api_key_env: null
          upstream: kairyu
          allow_templated_chat_passthrough: true
          chat_tokenizer: /models/deepseek-v4-flash-0731
          model_revision: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
          max_model_len: 1048576
          quantization_format: mixed-fp4-fp8
          cache_descriptor: {family: deepseek-v4-hca-csa-dsa, block_size: 256}
          expert_parallel_size: 4
          attention_data_parallel_size: 4
          dspark_enabled: false
    unhealthy_after: 1
    prefix_index: true
    probe_interval_s: 2.0
orchestrators:
  kairyu-auto: {spec: /etc/kairyu/auto.yaml}
  kairyu-auto-max: {spec: /etc/kairyu/auto-max.yaml}

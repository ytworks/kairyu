# UI-visible quality policy. One L3 request enters this explicit L2 DAG, whose
# workers borrow the deployment-owned L1 pools directly. Completed pre-final
# work is carried separately as model-attributed reasoning_content.
workers:
  - name: tier1
    engine_ref: qwen3.6-27b
  - name: tier2
    engine_ref: deepseek-v4-flash-0731-thinking

router:
  kind: calibrated
  artifact: /etc/kairyu/router.json
  sha256: 9b3cc02780fd5a1cdf1073557b66900e14dd59b6dd655b961f6f85bc3cb51ca5
  target_mode: auto-max

roles:
  - name: vision_grounding
    worker: tier1
    role_type: vision
    extra_args:
      chat_template_kwargs:
        enable_thinking: false
    prompt: |
      [vision_grounding] Inspect every supplied image and extract the visual
      evidence needed to answer the user's request. Be precise about labels,
      values, trends, geometry, and uncertainty. Return grounded observations
      only; do not invent details that are not visible.
      Task: {query}

  - name: planner
    worker: tier2
    role_type: planner
    depends_on: [vision_grounding]
    prompt: |
      [planner] Think privately and briefly. Before the token budget ends, emit
      </think> followed immediately by a non-empty compact plan for the user's
      task. The plan after </think> is the only result passed to later roles.
      Task: {query}
      Visual grounding (empty when no image was supplied): {vision_grounding}

  - name: proposal_a
    worker: tier1
    role_type: proposal
    extra_args:
      chat_template_kwargs:
        enable_thinking: false
    depends_on: [planner]
    prompt: |
      [proposal_a] Solve the task independently using the plan.
      Task: {query}
      Plan: {planner}

  - name: proposal_b
    worker: tier1
    role_type: proposal
    extra_args:
      chat_template_kwargs:
        enable_thinking: false
    depends_on: [planner]
    prompt: |
      [proposal_b] Produce an adversarial solution that emphasizes edge cases.
      Task: {query}
      Plan: {planner}

  - name: proposal_c
    worker: tier1
    role_type: proposal
    extra_args:
      chat_template_kwargs:
        enable_thinking: false
    depends_on: [planner]
    prompt: |
      [proposal_c] Produce a verification-oriented independent solution.
      Task: {query}
      Plan: {planner}

  - name: draft_synthesis
    worker: tier2
    role_type: synthesizer
    depends_on: [vision_grounding, proposal_a, proposal_b, proposal_c]
    prompt: |
      [draft_synthesis] Think privately and briefly. Before the token budget
      ends, emit </think> followed immediately by a non-empty strongest accurate
      draft. The draft after </think> is the only result passed to later roles.
      Task: {query}
      Visual grounding (empty when no image was supplied): {vision_grounding}
      Proposal A: {proposal_a}
      Proposal B: {proposal_b}
      Proposal C: {proposal_c}

  - name: verifier
    worker: tier2
    role_type: verifier
    verifies: draft_synthesis
    depends_on: [vision_grounding, draft_synthesis]
    prompt: |
      [verifier] Think privately and briefly while checking the draft against
      the task. Before the token budget ends, emit </think> followed immediately
      by a non-empty verdict. Start that verdict with PASS when the draft is
      ready to publish; otherwise start with FAIL and give actionable defects.
      Task: {query}
      Visual grounding (empty when no image was supplied): {vision_grounding}
      Draft: {draft_synthesis}

  - name: publisher
    worker: tier1
    role_type: publisher
    extra_args:
      chat_template_kwargs:
        enable_thinking: false
    depends_on: [vision_grounding, draft_synthesis, verifier]
    prompt: |
      [publisher] Return only the final answer to the user. Incorporate the
      verified draft and notes; do not describe this orchestration process.
      Task: {query}
      Visual grounding (empty when no image was supplied): {vision_grounding}
      Verified draft: {draft_synthesis}
      Verifier: {verifier}

moa_samples: 0
internal_max_tokens: 2048
expose_intermediate_outputs: true

budget:
  max_steps: 12
  max_refine_depth: 2

name: kairyu-qwen36-deepseekv4-8gpu

x-qwen: &qwen
  image: ${VLLM_IMAGE:-local/vllm-openai:sm120-aa0d513027}
  ipc: host
  environment:
    HF_HOME: /models/.cache
    HF_HUB_OFFLINE: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    VLLM_NO_USAGE_STATS: "1"
    VLLM_USE_DEEP_GEMM: "0"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    SAFETENSORS_FAST_GPU: "1"
  volumes: &qwen-volumes
    - type: bind
      source: ${QWEN_MODEL_STORAGE_PATH}
      target: /models
      read_only: true
  command: &qwen-command
    - /models/qwen3.6-27b-fp8
    - --served-model-name
    - qwen3.6-27b
    - --max-model-len
    - "262144"
    - --tensor-parallel-size
    - "4"
    # RTX PRO 6000 PCIe pairs have no NVLink/custom-all-reduce path. NCCL is
    # the portable vLLM transport for the TP2/TP4 comparison candidates.
    - --disable-custom-all-reduce
    - --language-model-only
    - --dtype
    - bfloat16
    - --kv-cache-dtype
    - fp8
    - --mamba-cache-dtype
    - float16
    - --mamba-ssm-cache-dtype
    - float16
    - --mamba-cache-mode
    - align
    - --enable-prefix-caching
    - --enable-chunked-prefill
    - --max-num-batched-tokens
    - "16384"
    - --max-num-seqs
    - "32"
    - --gpu-memory-utilization
    - "0.95"
    - --attention-backend
    - FLASHINFER
    - --enable-flashinfer-autotune
    - --compilation-config
    - '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
    - --generation-config
    - vllm
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_coder
    - --disable-uvicorn-access-log
  healthcheck: &health
    test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)']
    interval: 5s
    timeout: 3s
    retries: 1440
    start_period: 30s
  restart: unless-stopped

services:
  qwen-0:
    <<: *qwen
    cpuset: ${QWEN_0_CPUSET}
    volumes:
      - type: bind
        source: ${QWEN_MODEL_STORAGE_PATH}
        target: /models
        read_only: true
      - type: bind
        source: ${QWEN_CACHE_0_PATH}
        target: /root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]

  deepseek:
    image: ${VLLM_IMAGE:-local/vllm-openai:sm120-aa0d513027}
    ipc: host
    cpuset: ${DEEPSEEK_CPUSET}
    environment:
      HF_HOME: /models/.cache
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      # MegaMoE currently rejects SM120 as SM100-only in the pinned build.
      VLLM_USE_DEEP_GEMM: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      SAFETENSORS_FAST_GPU: "1"
    volumes:
      - deepseek-models:/models:ro
      - type: bind
        source: ${DEEPSEEK_CACHE_PATH}
        target: /root/.cache/vllm
      - ../deepseek-v4-flash-0731-8gpu/identity-chat.jinja:/etc/kairyu/identity-chat.jinja:ro
    command:
      - /models/deepseek-v4-flash-0731
      - --served-model-name
      - deepseek-v4-flash-0731
      - --max-model-len
      - "1048576"
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8
      - --block-size
      - "256"
      - --tensor-parallel-size
      - "4"
      - --enable-expert-parallel
      - --attention-config
      - '{"use_fp4_indexer_cache":false}'
      - --speculative-config
      - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"greedy"}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
      - --tokenizer-mode
      - deepseek_v4
      - --reasoning-parser
      - deepseek_v4
      - --chat-template
      - /etc/kairyu/identity-chat.jinja
      - --enable-prefix-caching
      - --gpu-memory-utilization
      - "0.95"
      - --max-num-seqs
      - "32"
      - --max-num-batched-tokens
      - "16384"
      - --disable-uvicorn-access-log
    healthcheck: *health
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4", "5", "6", "7"]
              capabilities: [gpu]
    restart: unless-stopped

  kairyu:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${KAIRYU_IMAGE:-local/kairyu:tiered-frontier-example}
    command: [/etc/kairyu/kairyu.yaml]
    environment:
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_IMAGE_ID:-local-build}
    volumes:
      - type: bind
        source: ${QWEN_MODEL_STORAGE_PATH}
        target: /models/qwen
        read_only: true
      - deepseek-models:/models/deepseek:ro
      - ./kairyu.yaml:/etc/kairyu/kairyu.yaml:ro
      - ./auto.yaml:/etc/kairyu/auto.yaml:ro
      - ./auto-max.yaml:/etc/kairyu/auto-max.yaml:ro
      - ./router.json:/etc/kairyu/router.json:ro
      - ./deepseek-thinking.jinja:/etc/kairyu/deepseek-thinking.jinja:ro
      - ../qwen3.6-27b-1gpu/chat_template.jinja:/etc/kairyu/qwen3.6-chat-template.jinja:ro
      - ../deepseek-v4-flash-0731-8gpu/deepseek-v4-0731.jinja:/etc/kairyu/deepseek-v4-0731.jinja:ro
    depends_on:
      qwen-0: {condition: service_healthy}
      deepseek: {condition: service_healthy}
    ports:
      - 127.0.0.1:${API_PORT:-8003}:8000
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 120
    restart: unless-stopped

  chat-ui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0-slim@sha256:3698bd4e9628b7ae3768808721098616e669b4a05a6bceb2f5da2d84a3282a01}
    environment:
      OPENAI_API_BASE_URL: http://kairyu:8000/v1
      OPENAI_API_KEY: sk-local-kairyu
      DEFAULT_MODELS: kairyu-auto
      DEFAULT_MODEL_PARAMS: '{"max_tokens":32768}'
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      WEBUI_AUTH: "true"
      WEBUI_URL: ${WEBUI_URL:-http://localhost:3000}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Kairyu Admin}
      ENABLE_OLLAMA_API: "false"
      RAG_EMBEDDING_ENGINE: ""
    volumes:
      - type: bind
        source: ${WEBUI_STORAGE_PATH}
        target: /app/backend/data
    depends_on:
      kairyu: {condition: service_healthy}
    ports:
      - ${CHAT_UI_BIND_ADDRESS:-127.0.0.1}:${CHAT_UI_PORT:-3000}:8080
    restart: unless-stopped

volumes:
  deepseek-models:
    external: true
    name: ${DEEPSEEK_MODEL_VOLUME:-kairyu-models-deepseek-v4-flash-0731-8gpu}

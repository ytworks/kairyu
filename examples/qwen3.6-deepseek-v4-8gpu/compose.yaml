name: kairyu-frontier-orchestration

x-qwen-vllm: &qwen-vllm
  profiles: [vllm]
  image: ${VLLM_QWEN_IMAGE}
  ipc: host
  environment: {HF_HUB_OFFLINE: "1", VLLM_NO_USAGE_STATS: "1"}
  volumes:
    - models:/models:ro
    - ../_shared/identity-chat.jinja:/etc/kairyu/identity-chat.jinja:ro
  command: [/models/qwen3.6-27b, --served-model-name, qwen3.6-27b, --max-model-len, "262144", --max-num-seqs, "64", --dtype, bfloat16, --chat-template, /etc/kairyu/identity-chat.jinja, --reasoning-parser, qwen3, --enable-prefix-caching, --gpu-memory-utilization, "0.95"]
  healthcheck: &health
    test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)']
    interval: 5s
    timeout: 3s
    retries: 1440

x-qwen-native: &qwen-native
  profiles: [kairyu]
  image: ${KAIRYU_GPU_IMAGE}
  ipc: host
  command: [/etc/kairyu/config.yaml]
  environment: {HF_HUB_OFFLINE: "1", KAIRYU_CONTAINER_IMAGE_DIGEST: "${KAIRYU_GPU_IMAGE}"}
  volumes:
    - models:/models:ro
    - ./qwen-kairyu.yaml:/etc/kairyu/config.yaml:ro
  healthcheck:
    test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2)']
    interval: 5s
    timeout: 3s
    retries: 1440

services:
  vllm-deepseek:
    profiles: [vllm]
    image: ${VLLM_DEEPSEEK_IMAGE}
    ipc: host
    cpuset: ${GPU_PAIR_0_1_CPUSET},${GPU_PAIR_2_3_CPUSET}
    environment: {HF_HUB_OFFLINE: "1", VLLM_NO_USAGE_STATS: "1"}
    volumes:
      - models:/models:ro
      - ../_shared/identity-chat.jinja:/etc/kairyu/identity-chat.jinja:ro
    command: [/models/deepseek-v4-flash-0731, --served-model-name, deepseek-v4-flash-0731, --max-model-len, "1048576", --trust-remote-code, --kv-cache-dtype, fp8, --block-size, "256", --enable-expert-parallel, --data-parallel-size, "4", --compilation-config, '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}', --attention_config.use_fp4_indexer_cache=True, --tokenizer-mode, deepseek_v4, --tool-call-parser, deepseek_v4, --enable-auto-tool-choice, --reasoning-parser, deepseek_v4, --chat-template, /etc/kairyu/identity-chat.jinja, --enable-prefix-caching]
    healthcheck: *health
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["0", "1", "2", "3"], capabilities: [gpu]}

  vllm-qwen-4:
    <<: *qwen-vllm
    cpuset: ${GPU_PAIR_4_5_CPUSET}
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["4"], capabilities: [gpu]}]}}}
  vllm-qwen-5:
    <<: *qwen-vllm
    cpuset: ${GPU_PAIR_4_5_CPUSET}
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["5"], capabilities: [gpu]}]}}}
  vllm-qwen-6:
    <<: *qwen-vllm
    cpuset: ${GPU_PAIR_6_7_CPUSET}
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["6"], capabilities: [gpu]}]}}}
  vllm-qwen-7:
    <<: *qwen-vllm
    cpuset: ${GPU_PAIR_6_7_CPUSET}
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["7"], capabilities: [gpu]}]}}}

  vllm-gateway:
    profiles: [vllm]
    image: ${KAIRYU_CPU_IMAGE}
    command: [/etc/kairyu/gateway.yaml]
    environment: {KAIRYU_CONTAINER_IMAGE_DIGEST: "${KAIRYU_CPU_IMAGE}"}
    volumes:
      - models:/models:ro
      - ./vllm-gateway.yaml:/etc/kairyu/gateway.yaml:ro
      - ./auto-vllm.yaml:/etc/kairyu/auto.yaml:ro
      - ./auto-max-vllm.yaml:/etc/kairyu/auto-max.yaml:ro
      - ./router.json:/etc/kairyu/router.json:ro
    depends_on:
      vllm-deepseek: {condition: service_healthy}
      vllm-qwen-4: {condition: service_healthy}
      vllm-qwen-5: {condition: service_healthy}
      vllm-qwen-6: {condition: service_healthy}
      vllm-qwen-7: {condition: service_healthy}
    ports: ["127.0.0.1:${PORT:-8003}:8000"]

  kairyu-deepseek:
    profiles: [kairyu]
    image: ${KAIRYU_GPU_IMAGE}
    ipc: host
    cpuset: ${GPU_PAIR_0_1_CPUSET},${GPU_PAIR_2_3_CPUSET}
    command: [/etc/kairyu/config.yaml]
    environment: {HF_HUB_OFFLINE: "1", KAIRYU_CONTAINER_IMAGE_DIGEST: "${KAIRYU_GPU_IMAGE}"}
    volumes:
      - models:/models:ro
      - ./deepseek-kairyu.yaml:/etc/kairyu/config.yaml:ro
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 1440
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["0", "1", "2", "3"], capabilities: [gpu]}]}}}

  kairyu-qwen-4:
    <<: *qwen-native
    cpuset: ${GPU_PAIR_4_5_CPUSET}
    environment: {HF_HUB_OFFLINE: "1", KAIRYU_CONTAINER_IMAGE_DIGEST: "${KAIRYU_GPU_IMAGE}"}
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["4"], capabilities: [gpu]}]}}}
  kairyu-qwen-5:
    <<: *qwen-native
    cpuset: ${GPU_PAIR_4_5_CPUSET}
    environment: {HF_HUB_OFFLINE: "1", KAIRYU_CONTAINER_IMAGE_DIGEST: "${KAIRYU_GPU_IMAGE}"}
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["5"], capabilities: [gpu]}]}}}
  kairyu-qwen-6:
    <<: *qwen-native
    cpuset: ${GPU_PAIR_6_7_CPUSET}
    environment: {HF_HUB_OFFLINE: "1", KAIRYU_CONTAINER_IMAGE_DIGEST: "${KAIRYU_GPU_IMAGE}"}
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["6"], capabilities: [gpu]}]}}}
  kairyu-qwen-7:
    <<: *qwen-native
    cpuset: ${GPU_PAIR_6_7_CPUSET}
    environment: {HF_HUB_OFFLINE: "1", KAIRYU_CONTAINER_IMAGE_DIGEST: "${KAIRYU_GPU_IMAGE}"}
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["7"], capabilities: [gpu]}]}}}

  kairyu-gateway:
    profiles: [kairyu]
    image: ${KAIRYU_CPU_IMAGE}
    command: [/etc/kairyu/gateway.yaml]
    environment: {KAIRYU_CONTAINER_IMAGE_DIGEST: "${KAIRYU_CPU_IMAGE}"}
    volumes:
      - models:/models:ro
      - ./kairyu-gateway.yaml:/etc/kairyu/gateway.yaml:ro
      - ./auto-kairyu.yaml:/etc/kairyu/auto.yaml:ro
      - ./auto-max-kairyu.yaml:/etc/kairyu/auto-max.yaml:ro
      - ./router.json:/etc/kairyu/router.json:ro
    depends_on:
      kairyu-deepseek: {condition: service_healthy}
      kairyu-qwen-4: {condition: service_healthy}
      kairyu-qwen-5: {condition: service_healthy}
      kairyu-qwen-6: {condition: service_healthy}
      kairyu-qwen-7: {condition: service_healthy}
    ports: ["127.0.0.1:${PORT:-8003}:8000"]

volumes:
  models: {external: true, name: "${MODEL_VOLUME}"}

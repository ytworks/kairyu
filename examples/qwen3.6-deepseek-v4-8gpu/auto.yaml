# L2 throughput tier: short prompts use one of four Qwen TP1 replicas, harder
# prompts use DeepSeek TP4+EP4, and very large/multi-step prompts use two Qwen
# proposals followed by one DeepSeek synthesis.
workers:
  - name: tier1
    backend: openai
    model: qwen3.6-27b
    base_url: http://kairyu:8000/v1
    api_key_env: null
    options:
      upstream: kairyu
      timeout_s: 86400
  - name: tier2
    backend: openai
    model: deepseek-v4-flash-0731
    base_url: http://kairyu:8000/v1
    api_key_env: null
    options:
      upstream: kairyu
      timeout_s: 86400

router:
  kind: rules
  # Keep ordinary interactive/agent turns on the four-replica throughput tier.
  # Code fences and truly heavy signals still reach Tier2; only extreme
  # multi-step/long requests pay for MoA-2.
  thresholds:
    multi_step_markers: 8
    multi_agent_min_chars: 262144
    reasoning_keywords: 6
    math_symbols: 64
    tier2_min_chars: 131072

moa_samples: 2

budget:
  # Two parallel proposals plus one synthesis; no recursive refinement.
  max_steps: 3
  max_refine_depth: 0

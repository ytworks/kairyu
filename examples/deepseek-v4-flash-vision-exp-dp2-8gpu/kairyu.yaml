server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  # 2 replicas x 32 vLLM sequences: admit exactly what L1 can run at once.
  max_concurrency: 64
  # A bounded queue wait fails a stuck request fast instead of parking it
  # (issue #495 rationale, shared with the tiered example).
  admission_wait_timeout_s: 600
  # Base64 image parts ride inside the chat body; the image policy below
  # bounds them to 64 MiB total, so the body cap must clear that.
  max_chat_body_bytes: 100663296

# One pool, two identical TP4+EP4 replicas. Kairyu L2 does no orchestration
# here: it only places each request on a replica (see the pool knobs below).
pools:
  deepseek-v4-flash-vision-exp:
    replicas:
      - backend: openai
        health_url: http://deepseek-0:8000/health
        options: &deepseek
          base_url: http://deepseek-0:8000/v1
          model: deepseek-v4-flash-vision-exp
          api_key_env: null
          # Bounded so a hung upstream call fails instead of holding its
          # replica slot for a day (issue #495).
          timeout_s: 1800
          upstream: vllm
          # vLLM owns the prompt: it renders every request (including OpenAI
          # image parts) with the checkpoint's own encoder (tokenizer-mode
          # deepseek_v4) and parses the tool calls, in whichever API the
          # caller used (see the lists at the end of this file).
          capabilities:
            allow_prompt_kinds: [multimodal]
            allow_chat_template_kwargs: [thinking, enable_thinking]
          # The checkpoint caps nothing per request (<= 387 prompt tokens per
          # image, minimum 147,456 px, >8:1 ratios cropped by the processor),
          # so these are Kairyu-side admission bounds: 8 images of up to
          # 16 Mpx / 8 MiB each, within the 1M-token context.
          image_input_policy:
            max_images: 8
            max_image_bytes: 8388608
            max_total_image_bytes: 67108864
            max_image_pixels: 16777216
            max_total_image_pixels: 134217728
            max_image_dimension: 8192
            max_image_aspect_ratio: 200
            max_processed_prompt_tokens: 1048576
          model_revision: 6821d6ad3681a4b137b066b76094fa82ebd0a380
          max_model_len: 1048576
          quantization_format: mixed-fp4-fp8
          cache_descriptor:
            family: deepseek-v4-hca-csa-dsa
            block_size: 256
          tensor_parallel_size: 4
          expert_parallel_size: 4
          attention_data_parallel_size: 1
          dspark_enabled: true
          # The served image is the shared SM120 build plus only the xhigh->max effort
          # patch (vllm-effort.Dockerfile), which changes no kernel or cache layout.
          # Recorded after the GPU build of the rebuilt image (GPU verification pending).
          container_image_digest: null
      - backend: openai
        health_url: http://deepseek-1:8000/health
        options: {<<: *deepseek, base_url: http://deepseek-1:8000/v1}
    unhealthy_after: 1
    # Placement policy: a request whose prompt prefix is already warm on a
    # replica goes there only while that replica is idle; the moment it has
    # one in-flight request the valve (threshold 0, strict >) falls through
    # to least-outstanding, so concurrent traffic alternates between the two
    # replicas before either takes a second request. Sessionless traffic with
    # no warm prefix is pure least-outstanding (ties -> lowest replica id).
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0
    # One JSONL row per placement (replica id, reason, hashed session);
    # verify.sh reads it to prove the per-row distribution.
    placement_log_path: /var/lib/kairyu/placement/deepseek-v4-flash-vision-exp.jsonl

# m9 D2 amendment 2026-10-17: L1 receives each request in its caller's API
# (chat as the caller's own messages, Responses as Responses, Anthropic
# Messages as Messages); vLLM renders and parses each one with the
# checkpoint's encoder (including DSML tools and image placeholders).
# Ordinary requests default to direct chat; an explicit effort (low/high/max,
# the encoder's own vocabulary) selects thinking mode, and L3 max reaches the
# Responses wire as xhigh, which the served image renders as max.
upstream_chat_models: [deepseek-v4-flash-vision-exp]
upstream_responses_models: [deepseek-v4-flash-vision-exp]
upstream_messages_models: [deepseek-v4-flash-vision-exp]

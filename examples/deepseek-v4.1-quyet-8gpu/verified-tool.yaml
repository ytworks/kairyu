# Model kairyu-verified-tool (VCO-D27; docs/design/example-verified-checklist-orchestration.md).
# Every request takes the same two stages; there is no route judge:
#
#   answer    (DeepSeek, caller)  the caller's conversation as it was sent
#                                 (native chat messages, the caller's tools and
#                                 format, the caller's effort), with no added
#                                 prompt: the answer DeepSeek alone would write
#   decision  (Quyet, strict)     five questions in one read of the answer:
#                                 would it cost the work more replies than
#                                 needed? E1 a call needed now left for later,
#                                 E2 no call where the move needs one, E3 an
#                                 invalid call, E4 a repeated step, E5 calls
#                                 that need each other's results
#
# All five at p >= 0.5: the answer is published as it is. Any below: answer
# writes the reply once more from refine_prompt (the conversation, the draft
# and the unmet questions with their probabilities), and that reply is
# published. Quyet reads the fix once more (its result is reported, the fix is
# published either way).
#
# Quyet reads at most 6,000 state tokens; the decision reads in strict mode, so
# a state Quyet would cut is refused and the answer is published unverified. The
# route replica (quyet-route, GPU 6) stays deployed with the L1 and is not read.
# The prompts stay generic for any tool-calling agent.
workers:
  - name: deepseek
    engine_ref: deepseek-v4.1-flash
  # Quyet's strict mode on quyet-judge (GPU 7): a state Quyet would cut is
  # refused, so the decision never passes a reply it could not read whole.
  - name: quyet_form
    systemone_ref: quyet-form-systemone

roles:
  # The answer, in one DeepSeek call. As the final unit it carries the caller's
  # response_format and tools and receives the caller's conversation as native
  # chat messages (m1 D8 amendment 2026-10-09); with no prompt nothing is added
  # to the first attempt. A fix sends refine_prompt as one final user message.
  # A fix changes only what the findings need and keeps every other call
  # (VCO-D16: repairs that rewrote whole replies changed the agent's commands).
  - name: answer
    worker: deepseek
    role_type: publisher
    reasoning_effort: inherit
    native_conversation: true
    sampling: {temperature: 1.0, top_p: 0.95, max_tokens: 262144}
    refine_prompt: |-
      Before replying, read the material below. It is not part of the
      conversation: never mention it in the reply. You already wrote the
      next assistant message (the draft below), and an independent judge
      found that it may cost the work more replies than needed; each finding
      is listed with the judge's probability that the requirement holds. The
      judge can be wrong: check each finding against the conversation
      yourself, and keep as it is what a finding the conversation does not
      support names. The draft's tool calls appear after its text as
      <tool_call>{{...}}</tool_call> and are not part of its text. Write the
      reply again. Change only what the findings need, and keep every other
      call with the same arguments and the same text:
      - E1 (a call left for later): add the calls the conversation shows are
        needed now and that need nothing from the reply's other calls.
      - E2 (no call made): make the call for the move needed now.
      - E3 (invalid call): call a declared tool with valid arguments.
      - E4 (repeated step): leave out the call whose result the conversation
        already shows, and make the call needed next instead.
      - E5 (calls that need each other): keep the calls that need no other
        call's result and leave the rest for a later reply.
      Every call you add must be safe now: it destroys, overwrites or
      reverts no work or data the request needs. Add no finishing call (the
      call or command the conversation defines for ending the work); it goes
      alone in its reply, after tool results show the steps it depends on
      succeeded. Make every call through the tool-calling interface; never
      write a call, its arguments, a <tool_call> envelope or a description of
      one in the reply text. Write only the reply, in exactly the format the
      conversation demands.
      --- DRAFT ---
      {previous}
      --- END DRAFT ---
      --- JUDGE'S FINDINGS ---
      {feedback}
      --- END ---

  # The decision: five Quyet questions in one strict read of the answer (its
  # text and its calls as <tool_call> envelopes), the tools and the
  # conversation (request messages and the newest ones). Each asks whether the
  # answer leaves a cause of extra replies: a call needed now left for later
  # (E1), a move with no call (E2), an invalid call (E3), a repeated step (E4),
  # calls that need each other's results (E5). Safety and the finishing call
  # are not judged: the answer is the one DeepSeek alone writes, and the fix
  # prompt keeps added calls safe and the finishing call alone.
  # VCO-D16: a high bar sent near-passes (p 0.998) to repair.
  - name: decision
    worker: quyet_form
    role_type: verifier
    verifies: answer
    depends_on: [answer]
    checklist:
      questions:
        - id: E1
          group: calls
          proposition: No call needed now is left for a later reply
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Does the reply
            include every call that the conversation already shows is needed now
            and that needs nothing from the reply's other calls?
          criteria_true: >-
            Every call the conversation shows is needed now and that needs nothing
            from the reply's calls is in the reply; or the next step depends on
            the results of the reply's calls; or the conversation limits a reply
            to one call or one step; or no tool call is needed; or the reply makes
            the finishing call
          criteria_false: >-
            The conversation already shows that a further call is needed now and
            needs nothing from the reply's calls, such as reading another file or
            output the conversation names or running another check the request
            asks for, and the reply leaves it for a later reply
        - id: E2
          group: calls
          proposition: The reply makes the call its move needs
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. When the work
            is not finished and the caller declared tools, does the reply make at
            least one tool call, make every action its text says it takes now as
            a call, and keep calls out of its text?
          criteria_true: >-
            The caller declared no tools, or the conversation accepts a plain-text
            reply and the reply is text only, such as an answer, a question back to
            the user or the final report once tool results show the work done; or
            the reply has at least one <tool_call> envelope, each action its text
            announces is made by a call, and the text writes out no call, command
            meant to be run, call arguments or call markup (such as
            JSON, DSML or a code block meant as the call)
          criteria_false: >-
            The work needs a tool call but the reply has no <tool_call> envelope;
            or the text says it runs, edits, checks or finishes something now that
            no call makes; or the text writes out a call, command meant to be run,
            arguments or call markup instead of making the call
        - id: E3
          group: calls
          proposition: Every call names a declared tool with valid arguments
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Does every call
            name one of the caller's tools, with arguments valid for that tool's
            parameters?
          criteria_true: >-
            The reply makes no call, or each call names a declared tool and its
            arguments are a JSON object with the parameters that tool requires and
            accepts
          criteria_false: >-
            A call names a tool the caller did not declare, or its arguments are
            missing, invalid or not what the tool accepts
        - id: E4
          group: calls
          proposition: No call repeats a step whose result is already shown
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Is every call a
            step whose result the conversation does not already show?
          criteria_true: >-
            The reply makes no call, or no call repeats an earlier call whose
            result the conversation shows and whose input nothing has changed
            since, such as reading a file again after it was edited or running a
            test again after a change
          criteria_false: >-
            A call repeats an earlier call, such as reading the same file or
            output or running the same command, whose result the conversation
            already shows and that nothing has changed since
        - id: E5
          group: calls
          proposition: Calls in one reply need no result of each other
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Does the reply
            make at most one call? If it makes several calls, answer yes only when
            each can be made without the result of another call in the same reply
            and the conversation allows several calls in one reply.
          criteria_true: >-
            The reply makes at most one call, or the arguments and safety of every
            call depend only on what the conversation already shows, and the
            conversation's instructions do not limit a reply to one call or one
            step
          criteria_false: >-
            A call needs the output of another call in the same reply to choose
            its arguments or to be safe, or the conversation limits a reply to one
            call or one step and the reply makes several
      state:
        - {key: reply, source: answer}
        - {key: tools, source: tools}
        - {key: conversation, source: query, max_chars: 2000, max_total_chars: 6000}
      threshold: 0.5
      max_questions_per_call: 32
      max_refinements: 1
      on_unavailable: publish_unverified
      feedback_header: >-
        Findings (p = probability that the requirement holds):
      feedback_item: "- [{id}] p={p} {proposition}"

# Every request reaches the publisher (zero markers always meets the
# multi-agent rule).
router:
  kind: rules
  thresholds: {multi_step_markers: 0}
moa_samples: 0
default_reasoning_effort: high
# Stage reports stay out of reasoning_content: an agent replays them in its
# next request, and the next turn would read last turn's decision (owner
# decision 2026-10-07).
expose_intermediate_outputs: false
budget:
  # The answer and its decision, one fix with its decision, and the answer's
  # empty-output re-dispatch.
  max_steps: 5
  max_refine_depth: 1

name: kairyu-qwen36-27b-1gpu

services:
  vllm:
    profiles: [vllm]
    image: ${VLLM_QWEN_IMAGE}
    ipc: host
    cpuset: ${SELECTED_GPU_CPUSET}
    environment:
      HF_HOME: /models/.cache
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - models:/models:ro
      - ../_shared/identity-chat.jinja:/etc/kairyu/identity-chat.jinja:ro
    command:
      - /models/qwen3.6-27b
      - --served-model-name
      - qwen3.6-27b
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "64"
      - --dtype
      - bfloat16
      - --chat-template
      - /etc/kairyu/identity-chat.jinja
      - --reasoning-parser
      - qwen3
      - --enable-prefix-caching
      - --gpu-memory-utilization
      - "0.95"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 720

  vllm-gateway:
    profiles: [vllm]
    image: ${KAIRYU_CPU_IMAGE}
    command: [/etc/kairyu/config.yaml]
    environment:
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_CPU_IMAGE}
    volumes:
      - models:/models:ro
      - ./vllm-gateway.yaml:/etc/kairyu/config.yaml:ro
    depends_on:
      vllm:
        condition: service_healthy
    ports: ["127.0.0.1:${PORT:-8001}:8000"]

  kairyu:
    profiles: [kairyu]
    image: ${KAIRYU_GPU_IMAGE}
    ipc: host
    cpuset: ${SELECTED_GPU_CPUSET}
    command: [/etc/kairyu/config.yaml]
    environment:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_GPU_IMAGE}
    volumes:
      - models:/models:ro
      - ./kairyu.yaml:/etc/kairyu/config.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    ports: ["127.0.0.1:${PORT:-8001}:8000"]

volumes:
  models:
    external: true
    name: ${MODEL_VOLUME}

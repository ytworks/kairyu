name: kairyu-qwen3-32b

services:
  model-download:
    image: python:3.12-slim
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - qwen3-32b:/models
    command:
      - /bin/sh
      - -ec
      - |
        pip install --no-cache-dir huggingface_hub==1.21.0 hf-xet==1.5.1
        python -c 'import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id="Qwen/Qwen3-32B", local_dir="/models/qwen3-32b", token=os.environ.get("HF_TOKEN") or None)'
    restart: "no"

  kairyu:
    build:
      context: ../..
      dockerfile: Dockerfile.cuda
    environment:
      # Empty means hardware-profile selection: FlashInfer on the supported
      # SM120 image, while an explicit caller override remains available.
      KAIRYU_ATTENTION_BACKEND: ${KAIRYU_ATTENTION_BACKEND:-}
    shm_size: 1gb
    ulimits:
      memlock: -1
    depends_on:
      model-download:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # a pipeline into wc -l would report a failed nvidia-smi as "0 GPUs" and
        # blame the count for what is really an unusable driver inside the
        # container (stale CDI spec, driver/library mismatch, missing devices)
        # stderr is NOT captured into the list: a warning carrying a date or bus
        # id would be counted as another GPU
        if ! gpu_list="$$(nvidia-smi --query-gpu=index --format=csv,noheader 2>/dev/null)"; then
          echo "nvidia-smi failed inside the container; GPUs are not usable here:" >&2
          nvidia-smi --query-gpu=index --format=csv,noheader >&2 2>&1 || true
          exit 1
        fi
        # awk, not `grep -c`: grep exits 1 on no matches and `set -e` would kill
        # this before the found-0 diagnostic runs
        unexpected="$$(printf '%s\n' "$$gpu_list" | awk 'NF && !/^[0-9]+$$/ { n++ } END { print n + 0 }')"
        if [ "$$unexpected" -ne 0 ]; then
          echo "nvidia-smi returned $$unexpected line(s) that are not GPU indices:" >&2
          printf '%s\n' "$$gpu_list" >&2
          exit 1
        fi
        gpu_count="$$(printf '%s\n' "$$gpu_list" | awk 'NF && /^[0-9]+$$/ { n++ } END { print n + 0 }')"
        case "$$gpu_count" in
          2|4|8) ;;
          *)
            echo "Qwen3-32B requires 2, 4, or 8 visible NVIDIA GPUs; found $$gpu_count" >&2
            exit 1
            ;;
        esac
        python3 -c '
        import json
        from pathlib import Path

        source = Path("/models/qwen3-32b/tokenizer_config.json")
        value = json.loads(source.read_text()).get("chat_template")
        if not isinstance(value, str) or not value.strip():
            raise ValueError(f"{source} has no string chat_template")
        Path("/tmp/qwen3-chat-template.jinja").write_text(value)
        '
        sed "s/__TENSOR_PARALLEL_SIZE__/$$gpu_count/" \
          /etc/kairyu/config.template.yaml > /tmp/kairyu.yaml
        echo "Starting Qwen3-32B with tensor_parallel_size=$$gpu_count"
        exec kairyu serve /tmp/kairyu.yaml
    ports:
      # PORT is the host port the example's scripts probe and benchmark; it must
      # reach the mapping or a custom value would start a healthy service on 8001
      # and then time out waiting somewhere else.
      - "127.0.0.1:${PORT:-8001}:8000"
    volumes:
      - ./kairyu.template.yaml:/etc/kairyu/config.template.yaml:ro
      - ../../bench:/bench:ro
      - ./benchmark_report.py:/opt/kairyu/benchmark_report.py:ro
      - ./results:/results
      - qwen3-32b:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${KAIRYU_GPU_COUNT:-all}
              capabilities: [gpu]

volumes:
  qwen3-32b:

# Fast local validation: reuse the already-built CUDA dependency image while
# loading the current checkout's Python package. Paths resolve relative to the
# base compose file.
services:
  kairyu:
    volumes:
      - ../../kairyu:/app/kairyu:ro

  auto-gateway:
    image: kairyu-qwen3-32b-kairyu:latest
    network_mode: host
    working_dir: /workspace
    entrypoint: ["kairyu", "serve"]
    command: ["examples/qwen3-32b-multi-gpu/auto-gateway.yaml"]
    depends_on:
      - kairyu
    volumes:
      - ../../kairyu:/app/kairyu:ro
      - ../..:/workspace:ro
      - ../../bench/results:/workspace/bench/results

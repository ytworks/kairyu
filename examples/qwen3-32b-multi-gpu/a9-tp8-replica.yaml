# G2 A9 TP8 arm.  Every engine setting other than the tensor-parallel degree
# matches the retained A8 TP4 replica so the crossover compares placement,
# rather than a different scheduler, KV capacity, or CUDA Graph contract.
server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  access_log: false
  max_concurrency: 128

engines:
  qwen3-32b:
    backend: kairyu
    options:
      model_path: /models/qwen3-32b
      tensor_parallel_size: 8
      num_pages: 8193
      max_model_len: 8192
      max_num_batched_tokens: 1024
      max_num_seqs: 16
      pipeline_depth: 5
      priority_age_s: 60.0
      decode_mode: cuda_graph
      cuda_graph_max_batch: 16
      cuda_graph_max_pages: 512
      cuda_graph_warmup_iters: 3

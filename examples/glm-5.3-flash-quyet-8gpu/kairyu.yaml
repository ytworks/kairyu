server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  max_concurrency: 128
  admission_wait_timeout_s: 600
  max_chat_body_bytes: 100663296
pools:
  glm-5.3-flash:
    replicas:
    - backend: openai
      health_url: http://glm:8000/health
      options:
        base_url: http://glm:8000/v1
        model: glm-5.3-flash
        api_key_env: null
        # 262,144 output tokens (the roles' max_tokens) at ~70 tok/s per stream
        # take ~62 min; the call must outlive that.
        timeout_s: 7200
        upstream: vllm
        # vLLM owns the prompt: it renders the checkpoint's official chat
        # template (tools, image placeholders, "Reasoning Effort: Low|High|Max")
        # and parses GLM tool calls and reasoning, so Kairyu forwards messages,
        # tools and reasoning_effort (low/high/max, the template's own values).
        capabilities:
          allow_prompt_kinds: [multimodal]
        # The processor caps each image at 8,000 tokens; these are Kairyu-side
        # admission bounds within vLLM's 8-image limit and the 1M context.
        image_input_policy:
          max_images: 8
          max_image_bytes: 8388608
          max_total_image_bytes: 67108864
          max_image_pixels: 16777216
          max_total_image_pixels: 134217728
          max_image_dimension: 8192
          max_image_aspect_ratio: 200
          max_processed_prompt_tokens: 1048576
        model_revision: eb9eb208eb0d988989d07a6a12d0fdeb5f52574a
        max_model_len: 1048576
        quantization_format: fp8
        cache_descriptor:
          family: glm-5.3-flash-hybrid-kda-nope-sparse-mla
        tensor_parallel_size: 2
        expert_parallel_size: 6
        attention_data_parallel_size: 3
        mtp_enabled: true
        container_image_digest: sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
    unhealthy_after: 1
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0
    # One JSONL row per placement; verify.sh reads it to count placements.
    placement_log_path: /var/lib/kairyu/placement/glm-5.3-flash.jsonl
  # Quyet-1.0-Large (bf16), two vLLM replicas, registered so that Kairyu
  # reports ready only while they are healthy. Quyet is a System One model:
  # no route chats with this pool; its adapters (below) read the weights.
  quyet-1.0-large:
    replicas:
    - backend: openai
      # vLLM serves /health, not Kairyu's default /readyz.
      health_url: http://quyet-route-vllm:8000/health
      options:
        base_url: http://quyet-route-vllm:8000/v1
        model: quyet-1.0-large
        api_key_env: null
        timeout_s: 300
        upstream: vllm
        container_image_digest: sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
        model_revision: 9a0f051112ba4301f6e4c8b87fc088ce00b11aae
        max_model_len: 8192
        quantization_format: bf16
        tensor_parallel_size: 1
    - backend: openai
      # vLLM serves /health, not Kairyu's default /readyz.
      health_url: http://quyet-judge-vllm:8000/health
      options:
        base_url: http://quyet-judge-vllm:8000/v1
        model: quyet-1.0-large
        api_key_env: null
        timeout_s: 300
        upstream: vllm
        container_image_digest: sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
        model_revision: 9a0f051112ba4301f6e4c8b87fc088ce00b11aae
        max_model_len: 8192
        quantization_format: bf16
        tensor_parallel_size: 1
    unhealthy_after: 1
    queue_depth_threshold: 0
    probe_interval_s: 2.0
# Quyet's typed decisions through this example's adapter (quyet_systemone.py),
# one replica per use: quyet-route-systemone (GPU 6) is the route judge,
# quyet-judge-systemone and quyet-form-systemone (GPU 7) the verified tool
# route's judgments and form check, so a burst of judgments never queues the
# next request's route decision. The form check reads in Quyet's strict mode
# (name quyet-strict): a state Quyet would cut at 6,000 tokens is refused with
# 400, so a reply too long to check is published unverified, never passed on
# its beginning. Each adapter reads 16 requests at a time and queues 16 more,
# then answers 529; Kairyu forwards at most 16 to a replica (8 + 8 on GPU 7)
# and queues 64 for 30 s, so a burst gets Kairyu's limit, never the adapter's
# 529. When the route judge does not
# answer, the route falls back to glm_think; when the judge does not
# answer, the verified tool route's answer is written without judgments and
# published without the form check.
systemone:
  quyet-route-systemone:
    base_url: http://quyet-route:8092
    upstream_model: Quyet-1.0-Large
    description: Quyet-1.0-Large route judge (bf16 on vLLM, GPU 6)
    max_concurrency: 16
    max_queue: 64
    queue_wait_s: 30
    timeout_s: 300
    max_questions: 32
    # the adapter's own 8 MiB limit
    max_body_bytes: 8388608
  quyet-judge-systemone:
    base_url: http://quyet-judge:8092
    upstream_model: Quyet-1.0-Large
    description: Quyet-1.0-Large candidate judgments (bf16 on vLLM, GPU 7)
    max_concurrency: 8
    max_queue: 64
    queue_wait_s: 30
    timeout_s: 300
    max_questions: 32
    # the adapter's own 8 MiB limit
    max_body_bytes: 8388608
  quyet-form-systemone:
    base_url: http://quyet-judge:8092
    upstream_model: quyet-strict
    description: Quyet-1.0-Large form check, strict (refuses a state it would cut; GPU 7)
    max_concurrency: 8
    max_queue: 64
    queue_wait_s: 30
    timeout_s: 300
    max_questions: 32
    # the adapter's own 8 MiB limit
    max_body_bytes: 8388608
orchestrators:
  # Quyet routes each request: the verified tool route when the next reply
  # needs a tool call, else one GLM answer at the caller's effort.
  kairyu-verified-tool:
    spec: /etc/kairyu/verified-tool.yaml
public_models:
- kairyu-verified-tool
# The L1 pools are internal resources, not public models.
# vLLM renders GLM's own chat template from the caller's messages (m9 D2
# amendment 2026-10-12); the internal Quyet pool is never chatted with.
upstream_chat_models:
- glm-5.3-flash
legacy_chat_models:
- quyet-1.0-large

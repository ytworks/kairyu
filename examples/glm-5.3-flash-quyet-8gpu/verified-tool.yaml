# Verified tool route (VCO-D24; docs/design/example-verified-checklist-orchestration.md).
# Model kairyu-verified-tool: Quyet judges whether the next reply needs to call
# one of the caller's tools. TOOL takes the verified tool route (primary,
# below); THINK takes glm_think (one GLM answer at the caller's
# effort).
#
#   answer        (GLM, caller)       makes the move needed now in one reply,
#                                     with every call needed now that is safe
#                                     and needs no other call's result
#   decision      (Quyet, strict)     9 questions on the reply: room for more
#                                     parallel calls (R1), safety (S1-S3),
#                                     form (F1-F5); a reply that fails is
#                                     written again once by answer with the
#                                     unmet requirements and their
#                                     probabilities (refine_prompt), and the
#                                     last reply is published either way
#   glm_think     (GLM)               one answer at the caller's effort, the
#                                     caller's conversation sent as it is
#
# GLM writes. Two Quyet replicas return probabilities through System One:
# quyet-route (GPU 6) the route, quyet-judge (GPU 7) the decision. Quyet reads
# at most 6,000 state tokens: the route state is bounded to fit (VCO-D21); the
# decision, whose reply cannot be bounded, reads in strict mode and is
# unavailable (the reply published unverified) when its state does not fit.
# The prompts stay generic for any tool-calling agent.
workers:
  - name: glm
    engine_ref: glm-5.3-flash
  - name: quyet_route
    systemone_ref: quyet-route-systemone
  # Quyet's strict mode: a state Quyet would cut is refused, so the decision
  # never passes a reply it could not read whole.
  - name: quyet_form
    systemone_ref: quyet-form-systemone

roles:
  # The move, in one GLM call. As the final unit it carries the caller's
  # response_format and tools, and receives the caller's conversation as
  # native chat messages with this prompt as one final user message (m1 D8
  # amendment 2026-10-09). A reply that fails the decision is written again
  # from refine_prompt (the draft and the unmet requirements), once.
  - name: answer
    worker: glm
    role_type: publisher
    reasoning_effort: inherit
    native_conversation: true
    sampling: {temperature: 1.0, top_p: 0.95, max_tokens: 262144}
    prompt: |-
      Before replying, read this note. It is not part of the
      conversation: never mention it in the reply. The reply is the next
      assistant message: the tool call or calls for the move needed now,
      from where the work stands, with at most a short text; not the
      final result in one jump, and not a repeat of a step whose result
      the conversation already shows. Make this move as large as it
      safely can be: include every call that is needed now and can be
      made now, that is, every call whose arguments and safety depend
      only on what the conversation already shows, not on the result of
      another call in this reply, and that changes nothing another call
      in this reply reads or changes (for example, read every file the
      next step needs, or run every independent check, together), and
      add no call the work does not need now. A call that needs another
      call's result waits for a later move. Make several calls only when
      the conversation's instructions do not limit a reply to one call
      or one step. Every call must be safe now: it destroys, overwrites
      or reverts no work or data the request needs, and changes nothing
      the request says must stay as it is. The finishing call (the call
      or command the conversation defines for ending the work) goes
      alone in its reply, and only after earlier tool results show every
      step it depends on succeeded. Make every call through the
      tool-calling interface; never write a call, its arguments or a
      description of one in the reply text, and never announce a call or
      an action without making the call in this reply. Write only the
      reply, in exactly the format the conversation demands.
    # A fix changes only what the unmet requirements need and keeps every
    # other call (VCO-D16: repairs that rewrote whole replies changed the
    # agent's commands and once replaced an exploring step with the
    # submission).
    refine_prompt: |-
      Before replying, read the material below. It is not part of the
      conversation: never mention it in the reply. A draft of the next
      assistant message was written, and an independent judge found that it
      does not meet some requirements; each unmet requirement is listed with
      the judge's probability that it holds. The judge can be wrong: check
      each finding against the conversation yourself, and keep as it is what
      a finding the conversation does not support names. The draft follows as
      text: its tool calls appear after its text as
      <tool_call>{{...}}</tool_call> and are not part of its text. Write the
      reply again. Change only what the unmet requirements need, and keep
      every other call with the same arguments and the same short text:
      - R1 (a call left out): add the calls the conversation shows are needed
        now, safe now and needing nothing from the reply's other calls.
      - S1 (a call is not safe now): replace it with a safe call for the
        same step, or leave it out.
      - S2 (calls depend on each other): keep the calls that need no other
        call's result and leave the rest for a later move.
      - S3 (finishing call batched or premature): leave it out and make the
        call that shows the steps it depends on succeeded.
      - F1-F5 (form): fix only the form.
      Make every call through the tool-calling interface; never write a
      call, its arguments, a <tool_call> envelope or a description of one in
      the reply text, and never announce a call or an action without making
      the call in this reply. Write only the reply, in exactly the format
      the conversation demands.
      --- DRAFT ---
      {previous}
      --- END DRAFT ---
      --- JUDGE'S FINDINGS ---
      {feedback}
      --- END ---

  # The decision on the move: nine Quyet questions in one strict read of the
  # reply (its text and its calls as <tool_call> envelopes), the tools and
  # the conversation (request messages and the newest ones). A state over
  # Quyet's 6,000 tokens (a long reply, many tools) is refused, so the reply
  # is published unverified instead of passed on what fits (PR #645 review).
  # A requirement read below 0.5 sends the reply back to answer's
  # refine_prompt once; the last reply is published either way.
  - name: decision
    worker: quyet_form
    role_type: verifier
    verifies: answer
    depends_on: [answer]
    checklist:
      questions:
        - id: R1
          group: room
          proposition: No call the conversation shows is needed now is left out
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Does the reply
            include every call that the conversation already shows is needed now
            and that needs nothing from the reply's other calls?
          criteria_true: >-
            Every call the conversation shows is needed now and that needs nothing
            from the reply's calls is in the reply; or the next step depends on
            the results of the reply's calls; or the conversation limits a reply
            to one call or one step; or the reply makes the finishing call
          criteria_false: >-
            The conversation already shows that a further call is needed now and
            needs nothing from the reply's calls, such as reading another file or
            output the conversation names or running another check the request
            asks for, and the reply leaves it for a later reply
        - id: S1
          group: safe
          proposition: Every call is safe to make now
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Is every call
            in the reply safe to make now?
          criteria_true: >-
            No call destroys, overwrites or reverts work or data the request
            needs, changes anything the request says must stay as it is, or adds
            a new error or warning on valid input
          criteria_false: >-
            A call can destroy, overwrite or revert needed work or data, changes
            what the request keeps, or adds an error or warning on valid input
        - id: S2
          group: safe
          proposition: Batched calls need no result of each other
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Does the reply
            make exactly one call? If it makes several calls, answer yes only when
            each can be made without the result of another call in the same reply
            and the conversation allows several calls in one reply.
          criteria_true: >-
            The reply makes one call, or the arguments and safety of every call
            depend only on what the conversation already shows, and the
            conversation's instructions do not limit a reply to one call or one
            step
          criteria_false: >-
            A call needs the output of another call in the same reply to choose
            its arguments or to be safe, or the conversation limits a reply to one
            call or one step and the reply makes several
        - id: S3
          group: safe
          proposition: A finishing call is alone and follows shown success
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. If the reply
            makes the finishing call (the call or command the conversation defines
            for ending the work), is it the only call and does it follow tool
            results that show every step it depends on succeeded?
          criteria_true: >-
            The reply makes no finishing call, or the finishing call is its only
            call and earlier tool results show the steps it depends on succeeded
          criteria_false: >-
            The finishing call is made together with other calls, or before tool
            results show the steps it depends on succeeded
        - id: F1
          group: form
          proposition: Every action the text announces is made as a call
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Is every action
            the text says it takes now, or is about to take, made as one of those
            calls?
          criteria_true: >-
            Each action the text announces is made by a call in the reply, or the
            text announces none
          criteria_false: >-
            The text says it runs, edits, checks or finishes something now that no
            call in the reply makes
        - id: F2
          group: form
          proposition: The text writes out no call
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Is the text
            before the <tool_call> envelopes free of calls written out?
          criteria_true: >-
            The text holds no call, command meant to be run, call arguments or
            call markup (such as JSON, <arg_key>/<arg_value> markup or a code block meant as the call)
          criteria_false: >-
            The text writes out a call, a command meant to be run, call arguments
            or call markup instead of making the call
        - id: F3
          group: form
          proposition: Every call names a declared tool with valid arguments
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Does every call
            name one of the caller's tools, with arguments valid for that tool's
            parameters?
          criteria_true: >-
            Each call names a declared tool and its arguments are a JSON object
            with the parameters that tool requires and accepts
          criteria_false: >-
            A call names a tool the caller did not declare, or its arguments are
            missing, invalid or not what the tool accepts
        - id: F4
          group: form
          proposition: The reply makes at least one call
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Does the reply
            make at least one tool call?
          criteria_true: >-
            The reply has at least one <tool_call> envelope
          criteria_false: >-
            The reply has no <tool_call> envelope
        - id: F5
          group: form
          proposition: The text is short and mentions no internal material
          ask: >-
            In the state, reply is the draft reply's text followed by its tool
            calls, each written as <tool_call>{{...}}</tool_call>. Is the reply's
            text short and free of material from outside the conversation?
          criteria_true: >-
            The text is at most a few sentences about this move and never mentions
            judgments, drafts, checks of the reply or other material outside the
            conversation
          criteria_false: >-
            The text is long, or mentions judgments, drafts, checks of the reply or
            other material outside the conversation
      state:
        - {key: reply, source: answer}
        - {key: tools, source: tools}
        - {key: conversation, source: query, max_chars: 2000, max_total_chars: 6000}
      # VCO-D16: a high bar sent near-passes (p 0.998) to repair.
      threshold: 0.5
      max_questions_per_call: 32
      max_refinements: 1
      on_unavailable: publish_unverified
      feedback_header: >-
        Requirements the draft does not meet (p = probability that the
        requirement holds):
      feedback_item: "- [{id}] p={p} {proposition}"

# Quyet route judge (VCO-D21; the question and choices of VCO-D20, m1 D9) on
# its own replica (quyet-route, GPU 6): one System One choice over the
# conversation.
# The judge's state carries tool_calling (whether the caller declared tools)
# beside the conversation. A judge that cannot answer routes to
# glm_think.
profile_judge:
  worker: quyet_route
  # The DSL maximum (owner decision 2026-10-09): a few agents' reads can
  # queue on the route replica.
  timeout_seconds: 60.0
  fallback: glm_think
  max_message_chars: 4000
  # Quyet reads at most 6,000 state tokens and cuts a longer object at its
  # end (the newest messages and the flags). 12,000 characters stay inside
  # it even for Japanese (2.1 characters per Quyet token; real agent turns
  # read 2.4-3.1). The bound keeps the request's messages and the newest
  # ones (m1 D9 amendment).
  max_conversation_chars: 12000
  question: >-
    Does the next assistant reply in this conversation need to call one of
    the caller's tools? tool_calling in the state says whether the caller
    declared any tools; without tools no call can be made. When the
    conversation's instructions require a tool call or command in every
    reply, or end the work with a tool call or command, every reply up to
    and including that final one needs a tool call.
  # TOOL whenever its probability reaches 0.1, else the most probable route
  # (owner decision 2026-10-11, VCO-D21 amendment): on 64 real agent turns the
  # most probable route sent 11 final turns, whose next move was the submit
  # command, to THINK; with the floor 5, and the routing set's TOOL miss stays
  # 5 % / 0 % with THINK precision 98.9 %.
  prefer:
    label: TOOL
    min_probability: 0.1
  choices:
    - profile: glm_think
      label: THINK
      criteria: >-
        no tool call is needed next: the caller declared no tools, or the
        conversation accepts a plain-text reply and the next reply is text
        only, such as a direct answer from what the model knows or what the
        conversation already shows, a question back to the user, or the
        final report once tool results show the work done
    - profile: primary
      label: TOOL
      criteria: >-
        the next reply must call one of the caller's tools: the request
        needs an action or information only a tool provides; the
        conversation ends with tool results or the assistant's own turns
        while the work is not yet finished; or the conversation's
        instructions require a tool call or command in every reply or to
        finish the work (for example a submit or finish command)

profiles:
  - name: glm_think
    roles:
      # The caller's conversation goes to GLM as it was sent (native
      # chat messages, the caller's tools and format, the caller's effort),
      # with no added prompt (m1 D8 amendment 2026-10-09).
      - name: glm_think_answer
        worker: glm
        role_type: publisher
        reasoning_effort: inherit
        native_conversation: true
        sampling: {temperature: 1.0, top_p: 0.95, max_tokens: 262144}

# Every request reaches the judge (zero markers always meets the
# multi-agent rule), so no request skips routing.
router:
  kind: rules
  thresholds: {multi_step_markers: 0}
moa_samples: 0
default_reasoning_effort: max
# Stage reports stay out of reasoning_content: an agent replays them in its
# next request, and the next turn would read last turn's decision (owner
# decision 2026-10-07).
expose_intermediate_outputs: false
budget:
  # The answer and its decision, one fix with its decision, and the answer's
  # empty-output re-dispatch.
  max_steps: 5
  max_refine_depth: 1

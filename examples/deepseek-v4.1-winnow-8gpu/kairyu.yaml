server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  max_concurrency: 128
  admission_wait_timeout_s: 600
  max_chat_body_bytes: 100663296
pools:
  deepseek-v4.1-flash:
    replicas:
    - backend: openai
      health_url: http://deepseek:8000/health
      options:
        base_url: http://deepseek:8000/v1
        model: deepseek-v4.1-flash
        api_key_env: null
        # 262,144 output tokens (the model card's >= 256K) at ~100 tok/s per
        # stream take ~45 min; the call must outlive that.
        timeout_s: 7200
        upstream: vllm
        capabilities:
          allow_prompt_kinds:
          - multimodal
          # V4.1 thinks unless a request turns it off; a role without an
          # effort would be sent enable_thinking: false (every role of this
          # example declares one: the caller's, or max).
          allow_chat_template_kwargs:
          - enable_thinking
        image_input_policy:
          max_images: 8
          max_image_bytes: 8388608
          max_total_image_bytes: 67108864
          max_image_pixels: 16777216
          max_total_image_pixels: 134217728
          max_image_dimension: 8192
          max_image_aspect_ratio: 200
          max_processed_prompt_tokens: 1048576
        model_revision: dba1be0a40aa45a94ad051997016db3960a90277
        max_model_len: 1048576
        quantization_format: mixed-fp4-fp8
        cache_descriptor:
          family: deepseek-v41-swa-csa-engram
          block_size: 64
        tensor_parallel_size: 1
        expert_parallel_size: 6
        attention_data_parallel_size: 6
        dspark_enabled: true
        container_image_digest: sha256:119afb09d8b71203707c50e8f9da1300c9992aea6c7aaa959cdb18df7e2483c5
    unhealthy_after: 1
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0
    placement_log_path: /var/lib/kairyu/placement/deepseek-v4.1-flash.jsonl
  # Winnow-12B Q8_0, two replicas (llama.cpp, winnow-server); built as in
  # winnow-12b-q8-1gpu. Its chat is an internal pool; its typed decisions
  # (System One, below) are split by use: winnow-route (GPU 6) judges the
  # route, winnow-judge (GPU 7) judges the verified tool route's drafts.
  winnow-12b:
    replicas:
    - backend: openai
      # llama-server serves /health (503 while loading), not /readyz.
      health_url: http://winnow-route:8091/health
      options:
        base_url: http://winnow-route:8091/v1
        model: winnow-12b
        api_key_env: null
        timeout_s: 1800
        upstream: llamacpp
        capabilities:
          allow_prompt_kinds:
          - multimodal
        # Worst case stays below the 32 MiB request limit after a WebP image
        # is re-encoded as PNG for llama.cpp (LCP-D3).
        image_input_policy:
          max_images: 4
          max_image_bytes: 8388608
          max_total_image_bytes: 16777216
          max_image_pixels: 2097152
          max_total_image_pixels: 4194304
          max_image_dimension: 4096
          max_image_aspect_ratio: 200
          max_processed_prompt_tokens: 65536
        model_revision: b2b14213dfa252e6d6b543c8b334762e51772d29
        # Per-slot context: --context 524288 over --chat-parallel 8.
        max_model_len: 65536
        quantization_format: gguf:Q8_0
        tensor_parallel_size: 1
    - backend: openai
      # llama-server serves /health (503 while loading), not /readyz.
      health_url: http://winnow-judge:8091/health
      options:
        base_url: http://winnow-judge:8091/v1
        model: winnow-12b
        api_key_env: null
        timeout_s: 1800
        upstream: llamacpp
        capabilities:
          allow_prompt_kinds:
          - multimodal
        # Worst case stays below the 32 MiB request limit after a WebP image
        # is re-encoded as PNG for llama.cpp (LCP-D3).
        image_input_policy:
          max_images: 4
          max_image_bytes: 8388608
          max_total_image_bytes: 16777216
          max_image_pixels: 2097152
          max_total_image_pixels: 4194304
          max_image_dimension: 4096
          max_image_aspect_ratio: 200
          max_processed_prompt_tokens: 65536
        model_revision: b2b14213dfa252e6d6b543c8b334762e51772d29
        # Per-slot context: --context 524288 over --chat-parallel 8.
        max_model_len: 65536
        quantization_format: gguf:Q8_0
        tensor_parallel_size: 1
    unhealthy_after: 1
    probe_interval_s: 2.0
# Winnow's typed decisions, one replica per use: winnow-route-systemone (GPU 6)
# is the route judge, winnow-judge-systemone (GPU 7) the drafts' judgments, so
# a burst of judgments never queues the next request's route decision.
# winnow-server evaluates one decision request at a time and answers 429 once
# 128 wait; Kairyu forwards at most 64 and queues 32 per replica, so a burst
# gets Kairyu's 429 first. When the route judge does not answer, the route
# falls back to deepseek_think; when the judge does not answer, the verified
# tool route's answer is written without judgments.
systemone:
  winnow-route-systemone:
    base_url: http://winnow-route:8091
    upstream_model: Winnow-12B
    description: Winnow-12B Q8_0 route judge (llama.cpp, winnow-inference, GPU 6)
    max_concurrency: 64
    max_queue: 32
    queue_wait_s: 30
    timeout_s: 300
    max_body_bytes: 25165824
  winnow-judge-systemone:
    base_url: http://winnow-judge:8091
    upstream_model: Winnow-12B
    description: Winnow-12B Q8_0 draft judgments (llama.cpp, winnow-inference, GPU 7)
    max_concurrency: 64
    max_queue: 32
    queue_wait_s: 30
    timeout_s: 300
    max_body_bytes: 25165824
orchestrators:
  # Winnow routes each request: the verified tool route when the next reply
  # needs a tool call, else one DeepSeek answer at the caller's effort.
  kairyu-verified-tool:
    spec: /etc/kairyu/verified-tool.yaml
public_models:
- kairyu-verified-tool
# The L1 pools are internal resources, not public models.
legacy_chat_models:
- deepseek-v4.1-flash
- winnow-12b

name: kairyu-qwen3-6-27b

services:
  vllm:
    # Same pinned stock-vLLM image as deploy/compose/docker-compose.webui-vlm.yaml.
    # Kairyu's text reference path is single-device; this TP8 production
    # topology stays on stock vLLM and Kairyu fronts it as a pool.
    image: >-
      vllm/vllm-openai:v0.26.0-x86_64-cu129-ubuntu2404@sha256:4d08193d2fd05aadb1b5678f93ae609efb2635df67da45f3efe781c368b34dc8
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - qwen3-6-27b-model-cache:/root/.cache/huggingface
    command:
      - Qwen/Qwen3.6-27B
      - --revision
      - 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
      - --served-model-name
      - qwen3.6-27b
      - --tensor-parallel-size
      - "8"
      # Native context is 262,144 tokens; the example caps KV at a chat-sized
      # window so eight ways of tensor parallelism keep headroom for batching.
      - --max-model-len
      - "32768"
      - --reasoning-parser
      - qwen3
      # MTP weights ship with the checkpoint; the vLLM recipe enables them for
      # low-latency decode.
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --async-scheduling
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 8
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 360
      start_period: 60s

  kairyu:
    build:
      context: ../..
    volumes:
      - ./kairyu.yaml:/etc/kairyu/config.yaml:ro
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      # PORT is the host port the README advertises; it must reach the mapping
      # or a custom value would start a healthy service on 8001 and then time
      # out waiting somewhere else.
      - "127.0.0.1:${PORT:-8001}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

volumes:
  qwen3-6-27b-model-cache:

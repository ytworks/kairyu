# Logical DeepSeek modes share the same native multimodal chat endpoint.
# requirements_budget.py sets thinking per trusted L2 role on each request.
server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  responses_compaction_secret_env: KAIRYU_RESPONSES_COMPACTION_SECRET
  max_concurrency: 256
  admission_wait_timeout_s: 600
  max_chat_body_bytes: 16777216
pools:
  qwen3.8-27b:
    replicas:
    - backend: openai
      health_url: http://qwen-0:8000/health
      options:
        base_url: http://qwen-0:8000/v1
        model: qwen3.8-27b
        api_key_env: null
        timeout_s: 1800
        upstream: vllm
        capabilities: &id001
          allow_prompt_kinds:
          - multimodal
          allow_chat_template_kwargs:
          - enable_thinking
        image_input_policy: &id002
          max_images: 1
          max_image_bytes: 8388608
          max_total_image_bytes: 8388608
          max_image_pixels: 2097152
          max_total_image_pixels: 2097152
          max_image_dimension: 4096
          max_image_aspect_ratio: 200
          max_processed_prompt_tokens: 262144
        model_revision: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
        max_model_len: 262144
        quantization_format: fp8
        cache_descriptor: &id003
          family: qwen3.8-hybrid-mamba-paged-kv
        tensor_parallel_size: 1
        mtp_enabled: false
        container_image_digest: sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f
    - backend: openai
      health_url: http://qwen-1:8000/health
      options:
        base_url: http://qwen-1:8000/v1
        model: qwen3.8-27b
        api_key_env: null
        timeout_s: 1800
        upstream: vllm
        capabilities: *id001
        image_input_policy: *id002
        model_revision: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
        max_model_len: 262144
        quantization_format: fp8
        cache_descriptor: *id003
        tensor_parallel_size: 1
        mtp_enabled: false
        container_image_digest: sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f
    unhealthy_after: 1
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0
  deepseek-v4.1-flash:
    replicas:
    - backend: openai
      health_url: http://deepseek:8000/health
      options:
        base_url: http://deepseek:8000/v1
        model: deepseek-v4.1-flash
        api_key_env: null
        timeout_s: 1800
        upstream: vllm
        capabilities:
          allow_prompt_kinds:
          - multimodal
        image_input_policy:
          max_images: 8
          max_image_bytes: 8388608
          max_total_image_bytes: 67108864
          max_image_pixels: 16777216
          max_total_image_pixels: 134217728
          max_image_dimension: 8192
          max_image_aspect_ratio: 200
          max_processed_prompt_tokens: 1048576
        model_revision: dba1be0a40aa45a94ad051997016db3960a90277
        max_model_len: 1048576
        quantization_format: mixed-fp4-fp8
        cache_descriptor:
          family: deepseek-v41-swa-csa-engram
          block_size: 64
        tensor_parallel_size: 2
        expert_parallel_size: 6
        attention_data_parallel_size: 3
        dspark_enabled: false
        container_image_digest: sha256:8b8bcb200f3a77f289f2483526903df34c7f7b15f58691d8ab27c0ccb15e2eaf
    unhealthy_after: 1
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0
  deepseek-v4.1-flash-thinking:
    replicas:
    - backend: openai
      health_url: http://deepseek:8000/health
      options:
        base_url: http://deepseek:8000/v1
        model: deepseek-v4.1-flash
        api_key_env: null
        timeout_s: 1800
        upstream: vllm
        capabilities:
          allow_prompt_kinds:
          - multimodal
        image_input_policy:
          max_images: 8
          max_image_bytes: 8388608
          max_total_image_bytes: 67108864
          max_image_pixels: 16777216
          max_total_image_pixels: 134217728
          max_image_dimension: 8192
          max_image_aspect_ratio: 200
          max_processed_prompt_tokens: 1048576
        model_revision: dba1be0a40aa45a94ad051997016db3960a90277
        max_model_len: 1048576
        quantization_format: mixed-fp4-fp8
        cache_descriptor:
          family: deepseek-v41-swa-csa-engram
          block_size: 64
        tensor_parallel_size: 2
        expert_parallel_size: 6
        attention_data_parallel_size: 3
        dspark_enabled: false
        container_image_digest: sha256:8b8bcb200f3a77f289f2483526903df34c7f7b15f58691d8ab27c0ccb15e2eaf
    unhealthy_after: 1
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0
embeddings:
  embed-small:
    backend: fastembed
    model: sentence-transformers/all-MiniLM-L6-v2
    model_path: /opt/kairyu/models/all-MiniLM-L6-v2
    revision: 5f1b8cd78bc4fb444dd171e59b18f3a3af89a079
    model_sha256: bbd7b466f6d58e646fdc2bd5fd67b2f5e93c0b687011bd4548c420f7bd46f0c5
    provenance_sha256: 57246a4990eb0f08755df06ba57c1fec161032bd588332435e89c7ece244639c
    dimensions: 384
    batch_size: 64
    threads: 2
    max_concurrency: 2
executors:
  sandbox-python:
    base_url: http://executor
    uds_path: /run/kairyu-executor/executor.sock
    timeout_s: 25
    queue_wait_s: 8
orchestrators:
  kairyu-auto-max:
    spec: /etc/kairyu/auto-max.yaml
public_models:
- kairyu-auto-max
- embed-small
legacy_chat_models:
- qwen3.8-27b
- deepseek-v4.1-flash
- deepseek-v4.1-flash-thinking

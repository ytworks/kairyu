server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  responses_compaction_secret_env: KAIRYU_RESPONSES_COMPACTION_SECRET
  max_concurrency: 256
  # A bounded queue wait fails a stuck request fast instead of parking it for
  # a day (issue #495).
  admission_wait_timeout_s: 600
  max_chat_body_bytes: 16777216

pools:
  qwen3.8-27b:
    replicas:
      - backend: openai
        health_url: http://qwen-0:8000/health
        options: &qwen
          base_url: http://qwen-0:8000/v1
          model: qwen3.8-27b
          api_key_env: null
          # Bounded so a hung upstream call fails instead of holding its
          # replica slot; above the largest Qwen role cap (16384 tokens at
          # medium thinking) even at the c32 per-stream rate.
          timeout_s: 3600
          upstream: vllm
          capabilities:
            allow_prompt_kinds: [multimodal]
            # The Conductor sends enable_thinking=false for effort-less roles
            # (head, qwen_direct, the route judge); thinking roles carry a
            # top-level reasoning_effort that the example-local Qwen template
            # turns into thinking mode.
            allow_chat_template_kwargs: [enable_thinking]
          image_input_policy:
            max_images: 1
            max_image_bytes: 8388608
            max_total_image_bytes: 8388608
            max_image_pixels: 2097152
            max_total_image_pixels: 2097152
            max_image_dimension: 4096
            max_image_aspect_ratio: 200
            max_processed_prompt_tokens: 262144
          model_revision: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
          max_model_len: 262144
          quantization_format: fp8
          cache_descriptor:
            family: qwen3.8-hybrid-mamba-paged-kv
          tensor_parallel_size: 1
          mtp_enabled: false
          container_image_digest: sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f
      - backend: openai
        health_url: http://qwen-1:8000/health
        options: {<<: *qwen, base_url: http://qwen-1:8000/v1}
    unhealthy_after: 1
    # Overflow as soon as the affine replica has one in-flight request, so the
    # four concurrent policy answers spread over both Qwen GPUs (2 + 2).
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0
    placement_log_path: /var/lib/kairyu/placement/qwen3.8-27b.jsonl

  # One native V4.1 chat service on GPUs 0-5. Thinking and non-thinking roles
  # share this pool: the Conductor sends enable_thinking=false for effort-less
  # roles and a top-level reasoning_effort for thinking roles; vLLM's
  # deepseek_v41 tokenizer mode renders both (no server-side thinking default
  # is configured, see compose.yaml).
  deepseek-v4.1-flash:
    replicas:
      - backend: openai
        health_url: http://deepseek:8000/health
        options:
          base_url: http://deepseek:8000/v1
          model: deepseek-v4.1-flash
          api_key_env: null
          # The largest DeepSeek role cap is 131072 tokens (synthesis at max
          # effort); at the measured c32 per-stream rate that needs more than
          # the tiered example's 1800 s. unhealthy_after: 1 means one timeout
          # parks the only replica until the 2 s prober restores it.
          timeout_s: 7200
          upstream: vllm
          capabilities:
            allow_prompt_kinds: [multimodal]
            allow_chat_template_kwargs: [enable_thinking]
          image_input_policy:
            max_images: 1
            max_image_bytes: 8388608
            max_total_image_bytes: 8388608
            max_image_pixels: 2097152
            max_total_image_pixels: 2097152
            max_image_dimension: 4096
            max_image_aspect_ratio: 200
            max_processed_prompt_tokens: 1048576
          model_revision: dba1be0a40aa45a94ad051997016db3960a90277
          max_model_len: 1048576
          quantization_format: mixed-fp4-fp8
          cache_descriptor:
            family: deepseek-v41-swa-csa-engram
            block_size: 64
          tensor_parallel_size: 2
          expert_parallel_size: 6
          attention_data_parallel_size: 3
          dspark_enabled: false
          # Image ID of the build the measurements were taken on (informational;
          # another host rebuilds the same recipe under its own ID).
          container_image_digest: sha256:18dad57d5b3d576797555e0e2c91f247ce4a39cba39ae20c79a4a2e09421a195
    unhealthy_after: 1
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0
    placement_log_path: /var/lib/kairyu/placement/deepseek-v4.1-flash.jsonl

embeddings:
  embed-small:
    backend: fastembed
    model: sentence-transformers/all-MiniLM-L6-v2
    model_path: /opt/kairyu/models/all-MiniLM-L6-v2
    revision: 5f1b8cd78bc4fb444dd171e59b18f3a3af89a079
    model_sha256: bbd7b466f6d58e646fdc2bd5fd67b2f5e93c0b687011bd4548c420f7bd46f0c5
    provenance_sha256: 57246a4990eb0f08755df06ba57c1fec161032bd588332435e89c7ece244639c
    dimensions: 384
    batch_size: 64
    threads: 2
    max_concurrency: 2

orchestrators:
  # The product: Qwen route judge in front of four direct routes and the
  # DeepSeek-led critical ensemble.
  kairyu-auto-max:
    spec: /etc/kairyu/auto-max.yaml
  # Verification-only model: the same ensemble DAG without the judge, so a
  # gate can prove the full five-candidate flow on every request. It shares
  # the pools above (no extra GPU capacity) and is not shown in the Chat UI.
  kairyu-ensemble-max:
    spec: /etc/kairyu/ensemble-max.yaml

public_models: [kairyu-auto-max, kairyu-ensemble-max, embed-small]

# vLLM owns both chat renderings: the example-local Qwen template on the Qwen
# services and the checkpoint's deepseek_v41 encoder on the DeepSeek service.
legacy_chat_models: [qwen3.8-27b, deepseek-v4.1-flash]

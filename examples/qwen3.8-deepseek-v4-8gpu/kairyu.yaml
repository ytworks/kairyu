server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  max_concurrency: 256
  admission_wait_timeout_s: 86400
  max_chat_body_bytes: 16777216

pools:
  qwen3.8-27b:
    replicas:
      - backend: openai
        health_url: http://qwen-0:8000/health
        options: &qwen
          base_url: http://qwen-0:8000/v1
          model: qwen3.8-27b
          api_key_env: null
          timeout_s: 86400
          upstream: vllm
          capabilities:
            allow_prompt_kinds: [multimodal]
            allow_chat_template_kwargs: [enable_thinking]
          image_input_policy:
            max_images: 1
            max_image_bytes: 8388608
            max_total_image_bytes: 8388608
            max_image_pixels: 2097152
            max_total_image_pixels: 2097152
            max_image_dimension: 4096
            max_image_aspect_ratio: 200
            max_processed_prompt_tokens: 262144
          model_revision: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
          max_model_len: 262144
          quantization_format: fp8
          cache_descriptor:
            family: qwen3.8-hybrid-mamba-paged-kv
          tensor_parallel_size: 1
          mtp_enabled: false
          container_image_digest: sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f
      - backend: openai
        health_url: http://qwen-1:8000/health
        options: {<<: *qwen, base_url: http://qwen-1:8000/v1}
      - backend: openai
        health_url: http://qwen-2:8000/health
        options: {<<: *qwen, base_url: http://qwen-2:8000/v1}
      - backend: openai
        health_url: http://qwen-3:8000/health
        options: {<<: *qwen, base_url: http://qwen-3:8000/v1}
    unhealthy_after: 1
    # Overflow as soon as the affine replica has one in-flight request. Agent
    # turns and MoA proposals deliberately share a cache session; a larger
    # threshold funnels concurrent work onto one GPU and leaves 3 replicas idle.
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0

  deepseek-v4-flash-0731:
    replicas:
      - backend: openai
        health_url: http://deepseek:8000/health
        options: &deepseek
          base_url: http://deepseek:8000/v1
          model: deepseek-v4-flash-0731
          api_key_env: null
          timeout_s: 86400
          upstream: vllm
          allow_templated_chat_passthrough: true
          chat_tokenizer: /models/deepseek/deepseek-v4-flash-0731
          model_revision: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
          max_model_len: 1048576
          quantization_format: mixed-fp4-fp8
          cache_descriptor:
            family: deepseek-v4-hca-csa-dsa
            block_size: 256
          tensor_parallel_size: 4
          expert_parallel_size: 4
          attention_data_parallel_size: 1
          dspark_enabled: true
          container_image_digest: sha256:99756b54424a4697f69476b29aa02fb7f8112aaa74fa8203a7bf8a0bae4ca6f1
    unhealthy_after: 1
    queue_depth_threshold: 8
    prefix_index: true
    probe_interval_s: 2.0

  # The L2 worker uses the same attested L1 but a max-thinking prompt policy.
  deepseek-v4-flash-0731-thinking:
    replicas:
      - backend: openai
        health_url: http://deepseek:8000/health
        options:
          <<: *deepseek
          # This prompt begins inside <think>. vLLM /completions does not run
          # its chat reasoning parser, so Kairyu privately separates everything
          # before the first terminator and exposes only the final answer.
          completion_reasoning_end_tag: "</think>"
    unhealthy_after: 1
    queue_depth_threshold: 8
    prefix_index: true
    probe_interval_s: 2.0

embeddings:
  embed-small:
    backend: fastembed
    model: sentence-transformers/all-MiniLM-L6-v2
    model_path: /opt/kairyu/models/all-MiniLM-L6-v2
    revision: 5f1b8cd78bc4fb444dd171e59b18f3a3af89a079
    model_sha256: bbd7b466f6d58e646fdc2bd5fd67b2f5e93c0b687011bd4548c420f7bd46f0c5
    provenance_sha256: 57246a4990eb0f08755df06ba57c1fec161032bd588332435e89c7ece244639c
    dimensions: 384
    batch_size: 64
    threads: 2
    max_concurrency: 2

# The sandbox has no network interface. Kairyu reaches its HTTP protocol over
# this shared Unix socket only (ECO-D1); a runtime outage still degrades to an
# `unavailable` report instead of failing requests.
executors:
  sandbox-python:
    base_url: http://executor
    uds_path: /run/kairyu-executor/executor.sock
    timeout_s: 25
    queue_wait_s: 8

orchestrators:
  kairyu-auto-max:
    spec: /etc/kairyu/auto-max.yaml

# The public API exposes one chat model plus one embedding model. L1 pools
# remain deployment-owned runtime resources and are not public model IDs.
public_models: [kairyu-auto-max, embed-small]

chat_templates:
  deepseek-v4-flash-0731: /etc/kairyu/deepseek-v4-0731.jinja
  deepseek-v4-flash-0731-thinking: /etc/kairyu/deepseek-thinking.jinja

legacy_chat_models: [qwen3.8-27b]

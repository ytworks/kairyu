server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  # winnow-server runs 8 chat slots and queues further requests without a
  # limit (llama-server defers them FIFO). Admit only what L1 runs at once.
  max_concurrency: 8
  admission_wait_timeout_s: 600
  # Below winnow-server's 32 MiB request limit, so Kairyu rejects first.
  max_chat_body_bytes: 25165824

engines:
  winnow-12b:
    backend: openai
    # llama-server serves /health (503 while loading), not Kairyu's /readyz.
    health_url: http://winnow:8091/health
    options:
      base_url: http://winnow:8091/v1
      model: winnow-12b
      api_key_env: null
      timeout_s: 1800
      upstream: llamacpp
      capabilities:
        allow_prompt_kinds: [multimodal]
      # Worst case stays below the 32 MiB request limit after a WebP image
      # is re-encoded as PNG for llama.cpp (LCP-D3): 4 Mpx RGBA, base64.
      image_input_policy:
        max_images: 4
        max_image_bytes: 8388608
        max_total_image_bytes: 16777216
        max_image_pixels: 2097152
        max_total_image_pixels: 4194304
        max_image_dimension: 4096
        max_image_aspect_ratio: 200
        max_processed_prompt_tokens: 65536
      model_revision: b2b14213dfa252e6d6b543c8b334762e51772d29
      # Per-slot context: --context 524288 over --chat-parallel 8.
      max_model_len: 65536
      quantization_format: gguf:Q8_0
      tensor_parallel_size: 1

legacy_chat_models: [winnow-12b]

# Winnow's typed decisions (Jev wire format) from the same loaded model.
# winnow-server evaluates one decision request at a time and answers 429 once
# 128 wait. Kairyu forwards at most 64 and queues 32, so a burst gets
# Kairyu's 429 first. Reads never pass through the chat engine.
systemone:
  winnow-12b-systemone:
    base_url: http://winnow:8091
    upstream_model: Winnow-12B
    aliases: [winnow-latest]
    description: Winnow-12B Q8_0 typed decisions (llama.cpp, winnow-inference)
    max_concurrency: 64
    max_queue: 32
    queue_wait_s: 30
    timeout_s: 300
    max_body_bytes: 25165824

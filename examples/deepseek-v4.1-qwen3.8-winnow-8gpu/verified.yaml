# Routed answers (VCO-D18; docs/design/example-verified-checklist-orchestration.md).
# Model kairyu-verified: Winnow routes each request to the verified route
# (primary, below) or to deepseek_think (one DeepSeek answer at the caller's
# effort). The verified route is identical to verified-always.yaml.
#
#   verified        (DeepSeek)  one answer at max effort; the guarantee that
#                               will check it is rebuilt later (VCO-D18)
#   deepseek_think  (DeepSeek)  one answer at the caller's effort
#
# DeepSeek writes; Winnow only returns route probabilities through System One.
workers:
  - name: deepseek
    engine_ref: deepseek-v4.1-flash
  - name: winnow
    systemone_ref: winnow-12b-systemone

roles:
  - name: verified_answer
    worker: deepseek
    role_type: publisher
    reasoning_effort: max
    sampling: {temperature: 1.0, top_p: 0.95, max_tokens: 262144}
    prompt: "{query}"

# Winnow route judge (VCO-D18, m1 D9): one System One choice over the whole
# conversation, with the old verified example's question and criteria. A
# judge that cannot answer routes to deepseek_think.
profile_judge:
  worker: winnow
  timeout_seconds: 10.0
  fallback: deepseek_think
  max_message_chars: 4000
  # Winnow's decision context holds 65,536 tokens; 120,000 characters of a
  # long conversation stay well inside it (VCO-D14 bound, same Gemma family).
  max_conversation_chars: 120000
  question: >-
    Which route should answer the latest user request in this conversation?
    The verified route checks the answer against every requirement before
    replying and is slower; the think route answers directly.
  # The most probable route wins (owner decision 2026-10-04; no preferred
  # label).
  choices:
    - profile: deepseek_think
      label: THINK
      criteria: >-
        everyday requests where a careful direct answer is enough: greetings
        and chit-chat, short factual questions, rewording, translation or
        formatting of short text, simple explanations and brainstorming, with
        no sign that an error would be costly
    - profile: primary
      label: VERIFIED
      criteria: >-
        requests that need an answer as accurate as possible: difficult or
        highly specialised questions; requests with many separate requirements
        or constraints; conversations where earlier answers were corrected or
        criticised, so another mistake is not acceptable; a user who is
        frustrated, impatient or under pressure; high-stakes domains (medical,
        legal, financial, safety, security); explicit demands for correctness,
        verification, sources or exact numbers; answers that will be
        published, sent, signed, executed or used for a decision; long
        multi-part deliverables with exact format or length rules

profiles:
  - name: deepseek_think
    roles:
      - name: deepseek_think_answer
        worker: deepseek
        role_type: publisher
        reasoning_effort: inherit
        sampling: {temperature: 1.0, top_p: 0.95, max_tokens: 262144}
        prompt: |-
          [deepseek_think_answer] Write the complete final answer to the request
          below, in exactly the reply format the conversation demands: if it
          requires a specific structure (for example a JSON envelope with fixed
          fields), produce precisely that structure and nothing else; if it asks
          for an exact, fixed, or trivially short output, write exactly that
          output. If the conversation context ends with a tool result, answer
          the user's request using that result directly. If the conversation
          requires calling an external tool or function next, emit exactly that
          call in the format the conversation specifies. Output only the answer
          itself and do not describe any internal pipeline.
          --- REQUEST ---
          {query}
          --- END REQUEST ---

# Every request reaches the judge (zero markers always meets the
# multi-agent rule), so no request skips routing.
router:
  kind: rules
  thresholds: {multi_step_markers: 0}
moa_samples: 0
default_reasoning_effort: high
internal_max_tokens: 65536
expose_intermediate_outputs: true
budget:
  max_steps: 2
  max_refine_depth: 0

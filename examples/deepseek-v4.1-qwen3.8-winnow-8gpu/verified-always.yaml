# Routed answers (VCO-D18; docs/design/example-verified-checklist-orchestration.md).
# Model kairyu-verified-always: every request takes the verified route, one
# DeepSeek answer at max effort; the guarantee that will check it is rebuilt
# later (VCO-D18). The route is identical to verified.yaml's primary.
workers:
  - name: deepseek
    engine_ref: deepseek-v4.1-flash

roles:
  - name: verified_answer
    worker: deepseek
    role_type: publisher
    reasoning_effort: max
    sampling: {temperature: 1.0, top_p: 0.95, max_tokens: 262144}
    prompt: "{query}"

router:
  kind: rules
  thresholds: {multi_step_markers: 0}
moa_samples: 0
default_reasoning_effort: high
internal_max_tokens: 65536
expose_intermediate_outputs: true
budget:
  max_steps: 2
  max_refine_depth: 0

name: kairyu-deepseek-v4-flash-0731-dp2-8gpu

# Two identical DeepSeek-V4-Flash-0731 TP4+EP4 vLLM replicas (four GPUs each)
# behind one Kairyu L3 endpoint. Kairyu L2 is only the replica pool: warm-prefix
# reuse when that replica is idle, otherwise least-outstanding placement, so
# concurrent traffic alternates evenly between the two halves (kairyu.yaml).
x-deepseek: &deepseek
  # The pinned SM120 source build plus the xhigh->max effort patch
  # (vllm-effort.Dockerfile); control.py builds it before `up`.
  image: ${DEEPSEEK_SERVED_VLLM_IMAGE:-local/vllm-openai:deepseek-v4-flash-0731-dp2-xhigh}
  ipc: host
  environment:
    HF_HOME: /models/.cache
    HF_HUB_OFFLINE: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    VLLM_NO_USAGE_STATS: "1"
    # MegaMoE currently rejects SM120 as SM100-only in the pinned build.
    VLLM_USE_DEEP_GEMM: "0"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    SAFETENSORS_FAST_GPU: "1"
    XDG_CACHE_HOME: /root/.cache
    TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
    TRITON_CACHE_DIR: /root/.cache/triton
    TILELANG_CACHE_DIR: /root/.cache/tilelang
    TILELANG_TMP_DIR: /root/.cache/tilelang/tmp
  # The tiered example's measured TP4+EP4 winner (its MEASUREMENTS.md, "Tier2
  # ... selection"): DSpark-5, 16K batch tokens, 32 sequences, FP8 KV, 256-token
  # blocks, prefix caching, full/piecewise CUDA Graphs; SM100-only MegaMoE and
  # FP4 indexer cache disabled on SM120.
  command:
    - /models/deepseek-v4-flash-0731
    - --served-model-name
    - deepseek-v4-flash-0731
    - --max-model-len
    - "1048576"
    - --trust-remote-code
    - --kv-cache-dtype
    - fp8
    - --block-size
    - "256"
    - --tensor-parallel-size
    - "4"
    - --enable-expert-parallel
    - --attention-config
    - '{"use_fp4_indexer_cache":false}'
    - --speculative-config
    - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"greedy"}'
    - --compilation-config
    - '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
    - --tokenizer-mode
    - deepseek_v4
    - --reasoning-parser
    - deepseek_v4
    # vLLM renders every request (chat, Responses, Messages) with the
    # checkpoint's own encoder (tokenizer-mode deepseek_v4) and parses DSML
    # tool calls; without --tool-call-parser the markup leaks into the answer
    # text and tool-driven agents fail (PR #584 review). Thinking defaults off
    # to keep the direct-chat contract; an explicit effort re-enables it.
    - --enable-auto-tool-choice
    - --tool-call-parser
    - deepseek_v4
    - --default-chat-template-kwargs
    - '{"thinking": false, "enable_thinking": false}'
    - --enable-prefix-caching
    - --gpu-memory-utilization
    - "0.95"
    - --max-num-seqs
    - "32"
    - --max-num-batched-tokens
    - "16384"
    - --disable-uvicorn-access-log
  healthcheck: &health
    test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)']
    interval: 5s
    timeout: 3s
    retries: 1440
    start_period: 30s
  restart: unless-stopped

services:
  deepseek-0:
    <<: *deepseek
    cpuset: ${DEEPSEEK_0_CPUSET}
    volumes:
      - deepseek-models:/models:ro
      - type: bind
        source: ${DEEPSEEK_CACHE_0_PATH}
        target: /root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]

  deepseek-1:
    <<: *deepseek
    cpuset: ${DEEPSEEK_1_CPUSET}
    volumes:
      - deepseek-models:/models:ro
      - type: bind
        source: ${DEEPSEEK_CACHE_1_PATH}
        target: /root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4", "5", "6", "7"]
              capabilities: [gpu]

  kairyu:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${KAIRYU_IMAGE:-local/kairyu:deepseek-v4-dp2-example}
    command: [/etc/kairyu/kairyu.yaml]
    environment:
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_IMAGE_ID:-local-build}
    volumes:
      # Per-placement JSONL evidence (replica id + reason per request) that
      # verify.sh reads to prove the even spread; session ids are hashed.
      - type: bind
        source: ${PLACEMENT_LOG_PATH}
        target: /var/lib/kairyu/placement
      - ./kairyu.yaml:/etc/kairyu/kairyu.yaml:ro
    depends_on:
      deepseek-0: {condition: service_healthy}
      deepseek-1: {condition: service_healthy}
    ports:
      - 127.0.0.1:${API_PORT:-8006}:8000
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 120
    restart: unless-stopped

  chat-ui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0-slim@sha256:3698bd4e9628b7ae3768808721098616e669b4a05a6bceb2f5da2d84a3282a01}
    environment:
      OPENAI_API_BASE_URL: http://kairyu:8000/v1
      OPENAI_API_KEY: sk-local-kairyu
      # m11 D7 amendment 2026-10-17: the Chat UI talks to Kairyu over
      # /v1/responses. An existing webui-data volume keeps its saved
      # connection; control.py checks it when the admin credentials are set.
      OPENAI_API_CONFIGS: '{"0":{"api_type":"responses"}}'
      DEFAULT_MODELS: deepseek-v4-flash-0731
      DEFAULT_MODEL_PARAMS: '{"max_tokens":32768}'
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      WEBUI_AUTH: "true"
      WEBUI_URL: ${WEBUI_URL:-http://localhost:3000}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Kairyu Admin}
      ENABLE_OLLAMA_API: "false"
      RAG_EMBEDDING_ENGINE: ""
    volumes:
      - type: bind
        source: ${WEBUI_STORAGE_PATH}
        target: /app/backend/data
    depends_on:
      kairyu: {condition: service_healthy}
    ports:
      - ${CHAT_UI_BIND_ADDRESS:-127.0.0.1}:${CHAT_UI_PORT:-3000}:8080
    restart: unless-stopped

volumes:
  deepseek-models:
    external: true
    name: ${DEEPSEEK_MODEL_VOLUME:-kairyu-models-deepseek-v4-flash-0731-8gpu}

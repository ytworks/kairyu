name: kairyu-deepseek-v4.1-flash-1017-8gpu
services:
  # One DeepSeek-V4.1-Flash-1017 replica on GPUs 0-7: TP8 with EP8 over the
  # 384 routed experts (48 per rank) and TP-sharded, GPU-resident Engram
  # tables (the deepseek-v4.1-flash-8gpu shape) on this example's SM120
  # kernels; NCCL all-reduce. Measured against DP8 / EP8: c1 +52 %, c8 +30 %,
  # c32 -28 %; selected by c8. 8,192 batched tokens: c32 +5.5 % over 4,096
  # (MEASUREMENTS.md records every candidate).
  deepseek:
    image: ${DEEPSEEK_VLLM_IMAGE:-local/vllm-openai:deepseek-v41-1017-8gpu}
    ipc: host
    environment:
      HF_HOME: /models/.cache
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      VLLM_NO_USAGE_STATS: '1'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      SAFETENSORS_FAST_GPU: '1'
      XDG_CACHE_HOME: /root/.cache
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
      TRITON_CACHE_DIR: /root/.cache/triton
      TILELANG_CACHE_DIR: /root/.cache/tilelang
      TILELANG_TMP_DIR: /root/.cache/tilelang/tmp
      VLLM_ENGINE_READY_TIMEOUT_S: '3600'
      VLLM_USE_RUST_FRONTEND: '0'
    command:
    - /models/deepseek-v4.1-flash-1017
    - --served-model-name
    - deepseek-v4.1-flash-1017
    - --max-model-len
    - '1048576'
    - --trust-remote-code
    - --tokenizer-mode
    - deepseek_v41
    - --tensor-parallel-size
    - '8'
    - --data-parallel-size
    - '1'
    - --enable-expert-parallel
    - --moe-backend
    - marlin
    - --engram-config
    - '{"cpu_offload":false}'
    - --attention-config
    - '{"backend":"FLASHINFER_MLA_SPARSE_DSV41","indexer_kv_dtype":"mxfp4"}'
    - --kv-cache-dtype
    - fp8
    - --block-size
    - '64'
    - --enable-prefix-caching
    - --gpu-memory-utilization
    - '0.92'
    - --max-num-seqs
    - '128'
    - --max-num-batched-tokens
    - '8192'
    - --speculative-config
    - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
    - --reasoning-parser
    - deepseek_v41
    - --enable-auto-tool-choice
    - --tool-call-parser
    - deepseek_v41
    - --default-chat-template-kwargs
    - '{"thinking":true,"reasoning_effort":"high"}'
    - --override-generation-config
    - '{"temperature":1.0,"top_p":1.0}'
    - --limit-mm-per-prompt
    - '{"image":8}'
    - --disable-uvicorn-access-log
    - --disable-custom-all-reduce
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health",
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 1440
      start_period: 30s
    restart: unless-stopped
    cpuset: ${DEEPSEEK_CPUSET}
    volumes:
    - type: bind
      source: ${DEEPSEEK_MODEL_STORAGE_PATH}
      target: /models
      read_only: true
    - type: bind
      source: ${DEEPSEEK_CACHE_PATH}
      target: /root/.cache
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids:
            - '0'
            - '1'
            - '2'
            - '3'
            - '4'
            - '5'
            - '6'
            - '7'
            capabilities:
            - gpu
  kairyu:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        KAIRYU_VISION: '1'
    image: ${KAIRYU_IMAGE:-local/kairyu:deepseek-v41-1017-8gpu-example}
    command:
    - /etc/kairyu/kairyu.yaml
    environment:
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_IMAGE_ID:-local-build}
    volumes:
    - type: bind
      source: ${PLACEMENT_LOG_PATH}
      target: /var/lib/kairyu/placement
    - ./kairyu.yaml:/etc/kairyu/kairyu.yaml:ro
    depends_on:
      deepseek:
        condition: service_healthy
    ports:
    - 127.0.0.1:${API_PORT:-8018}:8000
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz",
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 120
    restart: unless-stopped
  # Document extraction for the Chat UI's knowledge bases: Docling with
  # RapidOCR (PP-OCRv6; one recognizer covers Japanese, Chinese and English),
  # CPU only. The OCR language and the rest of the request options come from
  # the Chat UI's DOCLING_PARAMS. Its CPU limit keeps OCR from slowing the L1,
  # whose cpuset spans every host CPU: fully used, these 4 CPUs cost c1
  # serving 1.4 % (MEASUREMENTS.md); two workers x two threads fill them.
  docling:
    image: ${DOCLING_IMAGE}
    environment:
      DOCLING_SERVE_MAX_SYNC_WAIT: '3600'
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: '2'
      OMP_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
    cpus: 4
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:5001/health",
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped
  chat-ui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.3@sha256:ef11a68f38457d831e23168486858c25b9d9c4399094c9e72c0d4d8767ac09de}
    environment:
      OPENAI_API_BASE_URL: http://kairyu:8000/v1
      OPENAI_API_KEY: sk-local-kairyu
      # m11 D7 amendment 2026-10-17: the Chat UI talks to Kairyu over
      # /v1/responses (connection 0 is OPENAI_API_BASE_URL).
      OPENAI_API_CONFIGS: '{"0":{"api_type":"responses"}}'
      DEFAULT_MODELS: deepseek-v4.1-flash-1017
      DEFAULT_MODEL_PARAMS: '{"max_tokens":32768,"temperature":1.0,"top_p":1.0}'
      ENABLE_PERSISTENT_CONFIG: 'false'
      RESET_CONFIG_ON_START: 'true'
      ENABLE_SIGNUP: 'false'
      ENABLE_LOGIN_FORM: 'false'
      WEBUI_AUTH: 'false'
      WEBUI_URL: ${WEBUI_URL:-http://localhost:3018}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Kairyu Admin}
      ENABLE_OLLAMA_API: 'false'
      ENABLE_EVALUATION_ARENA_MODELS: 'false'
      # Japanese knowledge bases: Docling extraction (OCR for bitmaps only),
      # multilingual embedding and reranking from the pinned, hashed copies in
      # the data volume (control.py), no model downloads. Open WebUI's BM25
      # splits on whitespace and cannot tokenize Japanese, so hybrid search
      # runs with BM25 weight 0: vector search, then the reranker.
      CONTENT_EXTRACTION_ENGINE: docling
      DOCLING_SERVER_URL: ${DOCLING_SERVER_URL}
      DOCLING_PARAMS: ${DOCLING_PARAMS}
      RAG_EMBEDDING_ENGINE: ''
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL_PATH}
      RAG_RERANKING_ENGINE: ''
      RAG_RERANKING_MODEL: ${RAG_RERANKING_MODEL_PATH}
      ENABLE_RAG_HYBRID_SEARCH: 'true'
      RAG_HYBRID_BM25_WEIGHT: ${RAG_HYBRID_BM25_WEIGHT}
      RAG_TOP_K: ${RAG_TOP_K}
      RAG_TOP_K_RERANKER: ${RAG_TOP_K_RERANKER}
      # Chunks in characters. The default 1,000 is sized for English; a
      # 1,000-character Japanese chunk holds several times the content and
      # dilutes the passage a question asks about (MEASUREMENTS.md).
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}
      OFFLINE_MODE: 'true'
      # torch sees all 128 host CPUs and would start 64 threads under the
      # CPU limit below (20 reranker pairs at 16 CPUs: 20.1 s with 64 threads,
      # 7.9 s with 16); one thread per CPU.
      OMP_NUM_THREADS: '8'
    volumes:
    - type: bind
      source: ${WEBUI_STORAGE_PATH}
      target: /app/backend/data
    depends_on:
      kairyu:
        condition: service_healthy
      docling:
        condition: service_healthy
    # Embedding and reranking run on CPU in this container. With 16 CPUs,
    # embedding alone cut c1 serving 12.4 % (MEASUREMENTS.md).
    cpus: 8
    ports:
    - ${CHAT_UI_BIND_ADDRESS:-127.0.0.1}:${CHAT_UI_PORT:-3018}:8080
    restart: unless-stopped

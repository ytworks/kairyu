server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  max_concurrency: 128
  admission_wait_timeout_s: 600
  max_chat_body_bytes: 100663296
pools:
  deepseek-v4.1-flash-1017:
    replicas:
    - backend: openai
      health_url: http://deepseek:8000/health
      options:
        base_url: http://deepseek:8000/v1
        model: deepseek-v4.1-flash-1017
        api_key_env: null
        timeout_s: 1800
        upstream: vllm
        capabilities:
          allow_prompt_kinds:
          - multimodal
        image_input_policy:
          max_images: 8
          max_image_bytes: 8388608
          max_total_image_bytes: 67108864
          max_image_pixels: 16777216
          max_total_image_pixels: 134217728
          max_image_dimension: 8192
          max_image_aspect_ratio: 200
          max_processed_prompt_tokens: 1048576
        model_revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
        max_model_len: 1048576
        quantization_format: mixed-fp4-fp8
        cache_descriptor:
          family: deepseek-v41-swa-csa-engram
          block_size: 64
        tensor_parallel_size: 1
        expert_parallel_size: 8
        attention_data_parallel_size: 8
        dspark_enabled: true
        # Recorded after the build of this example's overlay (GPU selection pending).
        container_image_digest: sha256:995a89fcb6c9cf245b39143712bb3730837808e9bfb2b670d3f8abbfcbe65fbd
    unhealthy_after: 1
    queue_depth_threshold: 0
    prefix_index: true
    probe_interval_s: 2.0
    placement_log_path: /var/lib/kairyu/placement/deepseek-v4.1-flash-1017.jsonl
# vLLM renders the model author's encoder from the caller's own messages
# (earlier turns, tool calls and tool results) and parses tool calls, so
# Kairyu sends each chat's messages as they are (m9 D2 amendment 2026-10-12).
# m9 D2 amendment 2026-10-17: L1 receives each request in its caller's API
# (chat as the caller's own messages, Responses as Responses, Anthropic
# Messages as Messages); vLLM renders and parses each one.
upstream_chat_models:
- deepseek-v4.1-flash-1017
upstream_responses_models:
- deepseek-v4.1-flash-1017
upstream_messages_models:
- deepseek-v4.1-flash-1017

name: kairyu-deepseek-v4-8gpu

x-vllm: &vllm
  profiles: [vllm]
  image: ${VLLM_DEEPSEEK_IMAGE}
  ipc: host
  environment:
    HF_HOME: /models/.cache
    HF_HUB_OFFLINE: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    VLLM_NO_USAGE_STATS: "1"
    VLLM_USE_DEEP_GEMM: "0"
    VLLM_ENGINE_READY_TIMEOUT_S: "1800"
  volumes:
    - models:/models:ro
    - ../_shared/identity-chat.jinja:/etc/kairyu/identity-chat.jinja:ro
  command:
    - /models/deepseek-v4-flash-0731
    - --served-model-name
    - deepseek-v4-flash-0731
    - --max-model-len
    - "1048576"
    - --trust-remote-code
    - --kv-cache-dtype
    - fp8
    - --block-size
    - "256"
    - --enable-expert-parallel
    - --data-parallel-size
    - "4"
    - --enforce-eager
    - --attention_config.use_fp4_indexer_cache=False
    - --tokenizer-mode
    - deepseek_v4
    - --tool-call-parser
    - deepseek_v4
    - --enable-auto-tool-choice
    - --reasoning-parser
    - deepseek_v4
    - --chat-template
    - /etc/kairyu/identity-chat.jinja
    - --enable-prefix-caching
  healthcheck:
    test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)']
    interval: 5s
    timeout: 3s
    retries: 1440

x-native: &native
  profiles: [kairyu]
  image: ${KAIRYU_GPU_IMAGE}
  ipc: host
  command: [/etc/kairyu/config.yaml]
  environment:
    HF_HUB_OFFLINE: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_GPU_IMAGE}
  volumes:
    - models:/models:ro
    - ./kairyu-replica.yaml:/etc/kairyu/config.yaml:ro

services:
  vllm-a:
    <<: *vllm
    cpuset: ${GPU_PAIR_0_1_CPUSET},${GPU_PAIR_2_3_CPUSET}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]
  vllm-b:
    <<: *vllm
    cpuset: ${GPU_PAIR_4_5_CPUSET},${GPU_PAIR_6_7_CPUSET}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4", "5", "6", "7"]
              capabilities: [gpu]

  vllm-gateway:
    profiles: [vllm]
    image: ${KAIRYU_CPU_IMAGE}
    command: [/etc/kairyu/config.yaml]
    environment:
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_CPU_IMAGE}
    volumes:
      - models:/models:ro
      - ./vllm-gateway.yaml:/etc/kairyu/config.yaml:ro
    depends_on:
      vllm-a: {condition: service_healthy}
      vllm-b: {condition: service_healthy}
    ports: ["127.0.0.1:${PORT:-8002}:8000"]

  kairyu-a:
    <<: *native
    cpuset: ${GPU_PAIR_0_1_CPUSET},${GPU_PAIR_2_3_CPUSET}
    environment:
      HF_HUB_OFFLINE: "1"
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_GPU_IMAGE}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]
  kairyu-b:
    <<: *native
    cpuset: ${GPU_PAIR_4_5_CPUSET},${GPU_PAIR_6_7_CPUSET}
    environment:
      HF_HUB_OFFLINE: "1"
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_GPU_IMAGE}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4", "5", "6", "7"]
              capabilities: [gpu]

  kairyu-gateway:
    profiles: [kairyu]
    image: ${KAIRYU_CPU_IMAGE}
    command: [/etc/kairyu/config.yaml]
    environment:
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_CPU_IMAGE}
    volumes:
      - models:/models:ro
      - ./kairyu-gateway.yaml:/etc/kairyu/config.yaml:ro
    depends_on: [kairyu-a, kairyu-b]
    ports: ["127.0.0.1:${PORT:-8002}:8000"]

  kairyu-ep8:
    <<: *native
    profiles: [kairyu-ep8]
    cpuset: ${GPU_PAIR_0_1_CPUSET},${GPU_PAIR_2_3_CPUSET},${GPU_PAIR_4_5_CPUSET},${GPU_PAIR_6_7_CPUSET}
    volumes:
      - models:/models:ro
      - ./kairyu-ep8.yaml:/etc/kairyu/config.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3", "4", "5", "6", "7"]
              capabilities: [gpu]

  kairyu-ep8-gateway:
    profiles: [kairyu-ep8]
    image: ${KAIRYU_CPU_IMAGE}
    command: [/etc/kairyu/config.yaml]
    environment:
      KAIRYU_CONTAINER_IMAGE_DIGEST: ${KAIRYU_CPU_IMAGE}
    volumes:
      - models:/models:ro
      - ./kairyu-ep8-gateway.yaml:/etc/kairyu/config.yaml:ro
    depends_on: [kairyu-ep8]
    ports: ["127.0.0.1:${PORT:-8002}:8000"]

volumes:
  models:
    external: true
    name: ${MODEL_VOLUME}

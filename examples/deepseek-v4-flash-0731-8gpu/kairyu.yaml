server:
  host: 0.0.0.0
  port: 8000
  api_keys_env: null
  max_concurrency: 256
  admission_wait_timeout_s: 86400

engines:
  deepseek-v4-flash-0731:
    backend: openai
    health_url: http://vllm:8000/health
    options:
      base_url: http://vllm:8000/v1
      model: deepseek-v4-flash-0731
      api_key_env: null
      timeout_s: 86400
      upstream: vllm
      # vLLM owns the prompt: it renders every request with the checkpoint's
      # own encoder (tokenizer-mode deepseek_v4) and parses DSML tool calls,
      # the same L1 settings as the dp2 example (FN-D8 amendment 2026-10-17).
      capabilities:
        allow_chat_template_kwargs: [thinking, enable_thinking]
      model_revision: 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
      max_model_len: 1048576
      quantization_format: mixed-fp4-fp8
      cache_descriptor:
        family: deepseek-v4-hca-csa-dsa
        block_size: 256
      tensor_parallel_size: 8
      expert_parallel_size: 8
      attention_data_parallel_size: 1
      dspark_enabled: true
      # The L1 image is the effort overlay (vllm-effort.Dockerfile) of the
      # pinned SM120 build.
      # Recorded after the GPU build of the rebuilt image (GPU verification pending).
      container_image_digest: null

# m9 D2 amendment 2026-10-17: L1 receives each request in its caller's API
# (chat as the caller's own messages, Responses as Responses, Anthropic
# Messages as Messages); vLLM renders and parses each one.
upstream_chat_models: [deepseek-v4-flash-0731]
upstream_responses_models: [deepseek-v4-flash-0731]
upstream_messages_models: [deepseek-v4-flash-0731]

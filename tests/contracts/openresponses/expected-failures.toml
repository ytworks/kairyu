# Open Responses compliance gate (M20 WP-14, docs/design/m20-open-responses-ci.md).
#
# [suite] pins the upstream suite; scripts/open_responses_gate/run.py runs its
# bin/compliance-test.ts --json against Kairyu on ScenarioBackend
# (kairyu-mock.yaml), and scripts/open_responses_gate/drift.py runs upstream
# main against this list weekly.
#
# Each [[expected_failure]] names one scenario of the pinned suite that fails
# today: gap_id (research gap, review requirement or m20 decision) and
# owner_wp (the WP that makes it pass), the reason, and the exact set of
# errors the scenario reports while it fails for that reason: its `errors`
# plus the named [error_sets] it shares with other entries. `body_contains`
# is text its response body contains (an HTTP status error reports only
# "HTTP 400: [object Object]"; the reason is in the body). A listed scenario
# with an unlisted error, a listed error no longer seen or another body, an
# unlisted failure, a listed scenario that passes (XPASS) and a listed id the
# suite no longer has all fail the gate: the WP that fixes a scenario deletes
# its entry, and one that changes how a listed scenario fails updates its
# errors in the same PR.

[suite]
repository = "openresponses/openresponses"
commit = "92c12d96d7b61d6d15e2214daa5e9c6000ab6e1c"
spec = "2026-04-24"

# --- HTTP: the response envelope ---------------------------------------------

# The keys of the suite's ResponseResource that Kairyu's envelope lacks or
# leaves null (G-output-object-1, WP-08b). The suite reports only these
# envelope errors when they occur: it then skips its per-event stream checks.
[error_sets]
envelope = [
  "completed_at: Invalid input",
  "truncation: Required",
  "text: Expected object, received null",
  "top_p: Expected number, received null",
  "presence_penalty: Required",
  "frequency_penalty: Required",
  "top_logprobs: Required",
  "temperature: Expected number, received null",
  "max_tool_calls: Invalid input",
  "store: Required",
  "background: Required",
  "service_tier: Expected string, received null",
  "safety_identifier: Invalid input",
  "prompt_cache_key: Invalid input",
]

[[expected_failure]]
id = "basic-response"
gap_id = "G-output-object-1"
owner_wp = "WP-08b"
error_sets = ["envelope"]
reason = "The envelope lacks fields the suite's ResponseResource requires (completed_at, truncation, store, background, the sampling numbers, text.format, service_tier string, ...)."

[[expected_failure]]
id = "assistant-phase"
gap_id = "G-output-object-1"
owner_wp = "WP-08b"
error_sets = ["envelope"]
reason = "Assistant history with phase is accepted; the envelope fails as in basic-response."

[[expected_failure]]
id = "system-prompt"
gap_id = "G-output-object-1"
owner_wp = "WP-08b"
error_sets = ["envelope"]
reason = "The system message is accepted; the envelope fails as in basic-response."

[[expected_failure]]
id = "multi-turn"
gap_id = "G-output-object-1"
owner_wp = "WP-08b"
error_sets = ["envelope"]
reason = "Manual history is accepted; the envelope fails as in basic-response."

[[expected_failure]]
id = "tool-calling"
gap_id = "G-output-object-1"
owner_wp = "WP-08b"
error_sets = ["envelope"]
errors = ["tools.0.strict: Invalid input"]
reason = "The function_call item is emitted; the envelope fails as in basic-response, and the echoed function tool lacks strict."

[[expected_failure]]
id = "streaming-response"
gap_id = "G-output-object-1"
owner_wp = "WP-08b"
error_sets = ["envelope"]
reason = "The terminal response's envelope fails as in basic-response, so the suite reports only those errors and skips its per-event checks: this entry does not cover the stream events until WP-08b. The scenario runs with reasoning off: Kairyu's response.reasoning_text.* events are OpenAI's names, the suite's union says response.reasoning.* (openresponses PR #42)."

# --- HTTP: inputs and endpoints not built yet ---------------------------------

[[expected_failure]]
id = "image-input"
gap_id = "G-input-items-1"
owner_wp = "WP-25"
errors = ["HTTP 400: [object Object]"]
body_contains = "'input_image' is not supported"
reason = "Responses rejects message images with 400 until WP-25. ScenarioBackend rejects multimodal prompts, so WP-25 also gives this gate a backend that answers them."

[[expected_failure]]
id = "compact-response"
gap_id = "G-compaction-2"
owner_wp = "WP-36"
errors = ["HTTP 404: [object Object]"]
body_contains = "Invalid URL (POST /v1/responses/compact)"
reason = "POST /v1/responses/compact does not exist yet (404)."

[[expected_failure]]
id = "compact-missing-model"
gap_id = "G-compaction-2"
owner_wp = "WP-36"
errors = ["HTTP 404: [object Object]"]
body_contains = "Invalid URL (POST /v1/responses/compact)"
reason = "The suite expects 400 or 422 for a compact request without model; the route does not exist yet (404)."


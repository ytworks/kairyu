schema_version = 1

# These are the only retained wrapper-to-wrapper composition edges. They are
# frozen compatibility dependencies for formal/provenance paths, not a place
# for new reusable helpers; shared behavior belongs under kairyu.bench.
[compatibility_imports]
"bench.batched_spec_verify_qwen" = ["bench.batched_prefill_qwen"]
"bench.decode_page_table_cache_qwen" = ["bench.batched_prefill_qwen"]
"bench.fleet_rollout_bench" = ["bench.fleet_churn_bench"]
"bench.g2_a6_vllm_bench" = ["bench.multiturn_prefix", "bench.tp_kv_hit_g2_a7_bench"]
"bench.g2_a9_dp_tp_crossover_bench" = ["bench.dp_scaling_g2_a8_bench"]

"bench.g4_ma1_qwen3_235b_nvfp4_bench" = ["bench.parity_tp"]
"bench.g4_ma1_qwen3_235b_nvfp4_capture" = ["bench.g4_ma1_qwen3_235b_nvfp4_bench"]
"bench.g4_ma2_qwen3_235b_ep_kv_bench" = ["bench.g4_ma1_qwen3_235b_nvfp4_capture", "bench.tp_kv_hit_g2_a7_bench"]
"bench.g4_ma3_sglang_bench" = ["bench.g2_a6_vllm_bench", "bench.g4_ma1_qwen3_235b_nvfp4_bench", "bench.g4_ma1_qwen3_235b_nvfp4_capture"]

replicaCount: 1
image:
  repository: kairyu
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
workloadRole: standalone
podLabels: {}
podAnnotations: {}
# Kept true for backwards compatibility with EndpointSlice discovery. Static
# pools should set this false, as the private-cloud PoC does.
automountServiceAccountToken: true
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
terminationGracePeriodSeconds: 30
strategyType: RollingUpdate
service:
  type: ClusterIP
  port: 8000
  labels: {}
  annotations: {}
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
probes:
  startup:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 90
  readiness:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
gracefulDrain:
  enabled: false
  propagationSeconds: 10
  auth:
    secretName: ""
    secretKey: admin-key
resources: {}
nodeSelector: {}
runtimeClassName: ""
attentionBackend: ""
batchPostgres:
  enabled: false
  secretName: ""
  secretKey: dsn
  dsnEnvName: KAIRYU_BATCH_POSTGRES_DSN
# Responses sealing secret (m20 D6): every Pod gets the same secret, so
# compacted Codex sessions survive restarts, rolling updates and gateway hops.
# Without existingSecret the chart generates one on install and keeps it
# (helm lookup; never deleted by the chart). GitOps tools that render without
# cluster access must name a Secret they manage in existingSecret. The
# optional previousSecretsKey holds comma-separated accept-only secrets for
# two-phase rotation. config must reference both env names (as below);
# enabled: false renders only once config no longer names them.
responsesSealing:
  enabled: true
  existingSecret: ""
  secretKey: secret
  envName: KAIRYU_RESPONSES_COMPACTION_SECRET
  previousSecretsKey: previous
  previousSecretsEnvName: KAIRYU_RESPONSES_PREVIOUS_SECRETS
tolerations: []
affinity: {}
modelStorage:
  enabled: false
  pvcName: ""
  hostPath: ""
  mountPath: /models
# DeploymentSpec YAML mounted at exactly /etc/kairyu/config.yaml (the
# Dockerfile CMD — m10a A11)
config: |
  server:
    responses_compaction_secret_env: KAIRYU_RESPONSES_COMPACTION_SECRET
    sealing:
      previous_secrets_env: KAIRYU_RESPONSES_PREVIOUS_SECRETS
  engines:
    default:
      backend: mock
      options: {}

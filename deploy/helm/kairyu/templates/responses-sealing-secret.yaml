{{- /*
Responses sealing secret (m20 D6). Generated once and then reused: an upgrade
copies the live Secret's data (helm lookup), and the chart never deletes it,
so sealed items outlive restarts, upgrades and reinstalls. Renders without
cluster access (helm template, GitOps) cannot look it up; use existingSecret.
*/ -}}
{{- if and .Values.responsesSealing.enabled (not .Values.responsesSealing.existingSecret) }}
{{- $name := include "kairyu.sealingSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kairyu.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if and $existing $existing.data }}
  {{- toYaml $existing.data | nindent 2 }}
{{- else }}
  {{ .Values.responsesSealing.secretKey }}: {{ randAlphaNum 64 | b64enc | quote }}
{{- end }}
{{- end }}

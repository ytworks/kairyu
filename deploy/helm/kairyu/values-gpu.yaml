# m19 D2: GPU overrides — helm install -f values-gpu.yaml
replicaCount: 1
image:
  repository: kairyu
  tag: cuda
resources:
  limits:
    nvidia.com/gpu: 1
# per-profile node selection (roadmap hardware matrix):
#   rtx6000pro pools:  kairyu.dev/gpu-profile: pcie-gddr
#   h100 pools:        kairyu.dev/gpu-profile: nvlink-hbm
nodeSelector:
  kairyu.dev/gpu-profile: pcie-gddr
runtimeClassName: nvidia
# Keep the backend policy centralized. Retained Qwen3-32B SM120 evidence
# currently resolves auto to FlashInfer; explicit alternatives stay opt-in.
attentionBackend: auto
modelStorage:
  enabled: true
  pvcName: ""
  hostPath: /models
  mountPath: /models
# The mounted checkpoint's effective tokenizer must own a chat template.
# Otherwise extend config with a per-model chat_templates entry or explicit
# legacy_chat_models membership before installing this GPU overlay.
config: |
  engines:
    default:
      backend: kairyu
      options:
        model_path: /models/checkpoint

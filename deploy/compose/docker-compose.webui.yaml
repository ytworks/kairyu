# m11 D7: Open WebUI against the kairyu gateway (chat UI surface).
# Usage:
#   export WEBUI_ADMIN_EMAIL=... WEBUI_ADMIN_PASSWORD=...
#   docker compose -f deploy/compose/docker-compose.webui.yaml up -d --build --wait
#   docker compose -f deploy/compose/docker-compose.webui.yaml run --rm webui-setup
#   docker compose -f deploy/compose/docker-compose.webui.yaml \
#     --profile browser-smoke run --rm browser
# With the admin credentials set, Open WebUI creates that admin on its first
# start; without them the first account is created in the browser. webui-setup
# signs in as that admin (the credentials are required) and installs the L4
# Responses filter (deploy/workspace).
services:
  kairyu:
    build:
      context: ../..
      args:
        KAIRYU_EMBEDDINGS: "1"
        KAIRYU_EMBEDDING_MODEL_REPOSITORY: Qdrant/all-MiniLM-L6-v2-onnx
        KAIRYU_EMBEDDING_MODEL_REVISION: 5f1b8cd78bc4fb444dd171e59b18f3a3af89a079
        KAIRYU_EMBEDDING_MODEL_SHA256: bbd7b466f6d58e646fdc2bd5fd67b2f5e93c0b687011bd4548c420f7bd46f0c5
        KAIRYU_EMBEDDING_PROVENANCE_SHA256: 57246a4990eb0f08755df06ba57c1fec161032bd588332435e89c7ece244639c
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/etc/kairyu/config.yaml:ro
      - ./webui-orchestrator.yaml:/etc/kairyu/webui-orchestrator.yaml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  webui:
    image: >-
      ghcr.io/open-webui/open-webui:v0.12.3@sha256:ef11a68f38457d831e23168486858c25b9d9c4399094c9e72c0d4d8767ac09de
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://kairyu:8000/v1
      OPENAI_API_KEY: sk-local
      # m11 D7 amendment 2026-10-17: the chat UI talks to Kairyu over
      # /v1/responses (connection index 0 is OPENAI_API_BASE_URL).
      OPENAI_API_CONFIGS: '{"0":{"api_type":"responses"}}'
      # The admin-visible "new version available" toast lands bottom-right at
      # an unpredictable moment after login and intercepts pointer events on
      # the model selector (flaky webui-e2e "AUTO UI chat" click timeouts).
      ENABLE_VERSION_UPDATE_CHECK: "false"
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: embed-small
      RAG_OPENAI_API_BASE_URL: http://kairyu:8000/v1
      RAG_OPENAI_API_KEY: sk-local
      RAG_EMBEDDING_BATCH_SIZE: "32"
      ENABLE_ASYNC_EMBEDDING: "true"
      RAG_EMBEDDING_CONCURRENT_REQUESTS: "2"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      RAG_TOP_K: "1"
      RAG_RELEVANCE_THRESHOLD: "0"
      RAG_FULL_CONTEXT: "false"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "false"
      RAG_RERANKING_ENGINE: ""
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "true"
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      DEFAULT_MODELS: default
    depends_on:
      kairyu:
        condition: service_healthy
    volumes:
      - webui-data:/app/backend/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 10s

  # m11 D7 amendment 2026-10-18: Kairyu's /v1/responses rejects the Chat
  # Controls fields outside the Responses API, so the admin installs the
  # Responses filter once Open WebUI is healthy, with the L4 workspace setup
  # (deploy/workspace; this Open WebUI is set up only, not deployed by L4).
  # Run it after `up` (`run --rm webui-setup`): an exited one-shot service
  # fails `up --wait`.
  webui-setup:
    profiles: [setup]
    image: >-
      ghcr.io/open-webui/open-webui:v0.12.3@sha256:ef11a68f38457d831e23168486858c25b9d9c4399094c9e72c0d4d8767ac09de
    depends_on:
      webui:
        condition: service_healthy
    environment:
      WEBUI_URL: http://webui:8080
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      KAIRYU_WORKSPACE_SPEC: >-
        {"profile": null, "auth": "admin", "models": ["default", "kairyu-auto"],
        "reasoning_effort": null}
      PYTHONPATH: /opt/kairyu-workspace
    volumes:
      - ../workspace:/opt/kairyu-workspace:ro
    entrypoint: ["python3", "-m", "kairyu_workspace", "setup"]
    restart: "no"

  browser:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.webui-browser
    image: kairyu-webui-browser:playwright-1.60.0
    profiles: [browser-smoke]
    depends_on:
      webui:
        condition: service_healthy
    environment:
      WEBUI_BASE_URL: http://webui:8080
      WEBUI_SMOKE_EMAIL: browser-smoke@kairyu.local
      WEBUI_SMOKE_PASSWORD: "KairyuBrowserSmoke-197!"
      WEBUI_SMOKE_NAME: Kairyu Browser Smoke
      EXPECTED_DIRECT_MODEL: default
      EXPECTED_AUTO_MODEL: kairyu-auto
    volumes:
      - ../../scripts/webui_browser_smoke.mjs:/work/webui_browser_smoke.mjs:ro
    command: node /work/webui_browser_smoke.mjs

volumes:
  webui-data:

apiVersion: v1
kind: Service
metadata:
  name: f1a-replicas
  namespace: kairyu-f1a
  labels:
    app.kubernetes.io/name: f1a-replica
    app.kubernetes.io/part-of: kairyu-f1a
spec:
  # Each EndpointSlice address must remain individually visible to the
  # gateway; a load-balanced ClusterIP would collapse 200 identities into one.
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: f1a-replica
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: f1a-replica
  namespace: kairyu-f1a
  labels:
    app.kubernetes.io/name: f1a-replica
    app.kubernetes.io/part-of: kairyu-f1a
spec:
  serviceName: f1a-replicas
  replicas: 200
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: f1a-replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: f1a-replica
        app.kubernetes.io/part-of: kairyu-f1a
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          image: kairyu-f1a-mock:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Probe thresholds tolerate a slow or loaded node: one late probe
          # must neither drop a Ready replica from the EndpointSlice nor
          # restart it. Drain and deletion still withdraw the replica through
          # its own readiness flip and the EndpointSlice terminating state.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                # Flip readiness first, then leave the process alive while the
                # EndpointSlice controller and gateway reconciler remove it.
                command:
                  - /kairyu-f1a-mock
                  - drain
                  - -url=http://127.0.0.1:8080/admin/drain
                  - -grace=5s
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 100m
              memory: 32Mi

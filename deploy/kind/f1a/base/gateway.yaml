apiVersion: v1
kind: ConfigMap
metadata:
  name: f1a-gateway-config
  namespace: kairyu-f1a
  labels:
    app.kubernetes.io/name: f1a-gateway
    app.kubernetes.io/part-of: kairyu-f1a
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 8000
      max_concurrency: 256
    pools:
      f1a:
        discovery:
          type: kubernetes_endpoints
          service: f1a-replicas
          namespace: kairyu-f1a
          port: http
          model: f1a
          api_key_env: null
          poll_interval_s: 0.25
        unhealthy_after: 1
        queue_depth_threshold: 8
        # EndpointSlice discovery already withdraws terminating replicas every
        # 250 ms. A one-second backend probe still detects non-Kubernetes
        # failures well inside the five-second gate while reducing the maximum
        # unknown/ejected-replica probe burst by 4x.
        probe_interval_s: 1.0
        placement_log_path: /evidence/placements.jsonl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1a-gateway
  namespace: kairyu-f1a
  labels:
    app.kubernetes.io/name: f1a-gateway
    app.kubernetes.io/part-of: kairyu-f1a
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: f1a-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: f1a-gateway
        app.kubernetes.io/part-of: kairyu-f1a
    spec:
      serviceAccountName: f1a-gateway
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: kairyu:dev
          imagePullPolicy: IfNotPresent
          args: ["/etc/kairyu/config.yaml"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 300
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              # Formal churn measurements observed a 233m maximum. Reserve
              # >2x that demand so 20 concurrent Pod replacements cannot
              # starve the latency-bearing gateway on a shared kind node.
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/kairyu
              readOnly: true
            - name: evidence
              mountPath: /evidence
      volumes:
        - name: config
          configMap:
            name: f1a-gateway-config
        - name: evidence
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: f1a-gateway
  namespace: kairyu-f1a
  labels:
    app.kubernetes.io/name: f1a-gateway
    app.kubernetes.io/part-of: kairyu-f1a
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: f1a-gateway
  ports:
    - name: http
      port: 8000
      nodePort: 30080
      protocol: TCP
      targetPort: http

# P-B1 acceptance gateway: direct and AUTO share the exact same Qwen3-32B
# backend so their paired TTFT difference is orchestration overhead.
server:
  host: 127.0.0.1
  port: 8002
  api_keys_env: null
  max_concurrency: 64

pools:
  qwen3-32b:
    replicas:
      - backend: openai
        health_url: http://127.0.0.1:8001/readyz
        options:
          base_url: http://127.0.0.1:8001/v1
          model: qwen3-32b
          api_key_env: null
          upstream: kairyu

tenants:
  default_tenant: default
  limits:
    default:
      # Gateway normalization makes the fixed G2 A7 trace 562,096 prompt
      # tokens plus 512 one-token completions.  Keep the sustained 200k/minute
      # guard and size only its one-run burst for that declared trace.
      token_burst: 600000
      interactive_priority: 0
      batch_priority: 1

batch:
  data_dir: /tmp/kairyu-f5a-batches
  max_concurrency: 8

orchestrators:
  kairyu-auto:
    spec: auto-orchestrator.yaml
  kairyu-auto-max:
    spec: auto-max-orchestrator.yaml

legacy_chat_models: [qwen3-32b, kairyu-auto, kairyu-auto-max]

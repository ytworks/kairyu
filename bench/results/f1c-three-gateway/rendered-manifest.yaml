  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: f1c-gateway
      kairyu.ai/gateway-id: a
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/name: f1c-gateway
        app.kubernetes.io/part-of: kairyu-f1c
        kairyu.ai/gateway-id: a
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - /etc/kairyu/config.yaml
        env:
        - name: KAIRYU_BATCH_POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              key: dsn
              name: f1c-postgres
        - name: KAIRYU_BATCH_WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: KAIRYU_GATEWAY_ID
          value: a
        image: kairyu:dev
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
        name: gateway
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 300
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 1
          periodSeconds: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/kairyu
          name: config
          readOnly: true
        - mountPath: /evidence
          name: evidence
        - mountPath: /tmp
          name: tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: f1c-gateway
      terminationGracePeriodSeconds: 10
      volumes:
      - configMap:
          name: f1c-gateway-config
        name: config
      - hostPath:
          path: /var/lib/kairyu-f1c/evidence/a
          type: DirectoryOrCreate
        name: evidence
      - emptyDir: {}
        name: tmp
